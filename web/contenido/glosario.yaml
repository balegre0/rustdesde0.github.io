# Glosario del curso (CONTENIDO.md). Cada término: definición de una frase, sin jerga, y la lección donde se explica.
# «formas»: cómo aparece en el texto (plurales, variantes). En las lecciones se marca la primera aparición de cada término.
# «hasta»: último mundo en el que se marca (las palabras básicas dejan de marcarse cuando ya se dan por sabidas).
- termino: compilador
  formas: [compilador, compiladores]
  hasta: 6
  def: "El programa (`rustc`) que lee tu código, comprueba que es correcto y lo traduce a un programa que el ordenador puede ejecutar."
  leccion: 02-tu-primer-programa/06-el-viaje-de-rustc
- termino: compilar
  formas: [compilar, compila, compilas, compilan, compilando, compilación]
  hasta: 6
  def: "Traducir tu código a un programa ejecutable. Si el código tiene errores, no se compila y no hay programa."
  leccion: 00-el-taller/07-check-build-y-release
- termino: Cargo
  formas: [Cargo]
  hasta: 6
