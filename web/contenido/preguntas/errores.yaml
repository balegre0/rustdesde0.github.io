    - "Los structs sin campos no existen"
    - "`main` no puede estar vacío"
    - "Falta `pub`"
  correcta: 0
  solucion: |
    Cada nombre de tipo es único en su módulo.
    - `struct Punto;` (unitario) es válido.
    - `main` vacío es válido.
    - La visibilidad no tiene que ver.
  etiquetas: ["E0428"]

- id: err-e0432-1
  titulo: "Colecciones en otro idioma"
  mundo: 12-modulos-crates-y-cargo
  tema: modulos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0432
  opciones:
    - "El módulo se llama `std::collections`; `std::colecciones` no existe (E0432)"
    - "`use` solo funciona con crates externos"
    - "`HashMap` hay que importarlo con `mod`"
    - "Los `use` deben ir dentro de `main`"
  correcta: 0
  solucion: |
    Los nombres de `std` están en inglés.
    - `use` funciona con `std` y con módulos propios.
    - `mod` declara módulos, no importa.
    - `use` puede ir arriba del archivo.
  etiquetas: ["E0432", "use"]

- id: err-e0433-1
  titulo: "El mapa perdido"
  mundo: 11-colecciones-y-texto
  tema: modulos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0433
  opciones:
    - "`HashMap` no está en el preludio: falta `use std::collections::HashMap;` (E0433)"
    - "`HashMap` no existe en la biblioteca estándar"
    - "Los mapas no admiten claves `&str`"
    - "Falta indicar los tipos de clave y valor"
  correcta: 0
  solucion: |
    Solo lo del preludio se usa sin importar.
    - Existe, en `std::collections`.
    - `&str` es una clave válida.
    - Los tipos se infieren del `insert`.
  etiquetas: ["E0433", "use"]

- id: err-e0499-1
  titulo: "Dos manos en el mismo marcador"
  mundo: 07-prestamos
  tema: prestamos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0499
  opciones:
    - "`a` y `b` son dos préstamos exclusivos de `puntos` vivos a la vez (E0499)"
    - "No se puede sumar con `+=` a través de una referencia"
    - "`puntos` debería ser `u64`"
    - "Hay que escribir `*a = *a + 1`"
  correcta: 0
  solucion: |
    Mientras `a` se siga usando (línea 5), `b` no puede existir. rustc: `cannot borrow puntos as mutable more than once at a time`.
    - `*a += 1` es válido con un `&mut i32`.
    - El tipo entero no tiene nada que ver.
    - `*a = *a + 1` es lo mismo y da el mismo error.
  etiquetas: ["E0499", "&mut"]

- id: err-e0502-1
  titulo: "El primero de la lista"
  mundo: 07-prestamos
  tema: prestamos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0502
  opciones:
    - "`primero` toma prestado `lista` y `push` necesita un préstamo exclusivo mientras `primero` sigue vivo (E0502)"
    - "No se puede indexar un `Vec` con `[0]`"
    - "`push` solo acepta valores de tipo `usize`"
    - "`vec!` crea un vector de tamaño fijo"
  correcta: 0
  solucion: |
    `push` podría mover los datos a otra zona de memoria y `primero` apuntaría a memoria liberada. rustc: `cannot borrow lista as mutable because it is also borrowed as immutable`.
    - Indexar con `[0]` es válido.
    - `push` acepta el tipo de los elementos (`i32`).
    - `vec!` crea un `Vec`, que puede crecer.
  etiquetas: ["E0502", "&", "&mut"]

- id: err-e0502-2
  titulo: "Arreglar sin clonar"
  mundo: 07-prestamos
  tema: prestamos
  dificultad: media
  tipo: no-compila
  enunciado: "¿Cuál de estos cambios hace que compile?"
  ej: errores/E0502
  opciones:
    - "`let primero = lista[0];` (copiar el `i32` en vez de tomarlo prestado)"
    - "`let primero = &mut lista[0];`"
    - "`let primero = &lista[0..1];`"
    - "`let mut primero = &lista[0];`"
  correcta: 0
  solucion: |
    `i32` es `Copy`: `lista[0]` copia el número y no queda ningún préstamo vivo.
    - `&mut lista[0]` sería un préstamo exclusivo: choca igual con `push` (E0499).
    - `&lista[0..1]` sigue siendo un préstamo compartido.
    - `mut` en la variable no cambia el préstamo.
  etiquetas: ["E0502", "Copy"]

- id: err-e0503-1
  titulo: "Mirar de reojo"
  mundo: 07-prestamos
  tema: prestamos
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0503
  opciones:
    - "Se lee `valor` mientras `exclusivo` (un `&mut valor`) todavía se va a usar (E0503)"
    - "No se puede sumar `1` a un `i32`"
    - "`copia` debería ser `mut`"
    - "Los préstamos exclusivos solo valen para `String`"
  correcta: 0
  solucion: |
    Mientras el `&mut` está vivo, nadie más toca el valor, ni para leer. Mueve la lectura antes del `&mut`.
    - Sumar es válido.
    - `copia` no se modifica.
    - `&mut` vale para cualquier tipo.
  etiquetas: ["E0503", "&mut"]

- id: err-e0505-1
  titulo: "Consumido con testigos"
  mundo: 06-ownership
  tema: prestamos
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0505
  opciones:
    - "`nombre` se mueve a `consumir` mientras `r` todavía lo toma prestado (E0505)"
    - "`consumir` debería devolver un `String`"
    - "No se puede crear una referencia a un `String`"
    - "Falta `mut` en `let nombre`"
  correcta: 0
  solucion: |
    `consumir` se queda con el `String` y lo destruye al terminar; `r` apuntaría a memoria liberada. rustc: `cannot move out of nombre because it is borrowed`.
    - Que la función devuelva algo no cambia que el préstamo siga vivo.
    - `&String` es perfectamente válido.
    - Nadie modifica `nombre`.
  etiquetas: ["E0505", "move"]

- id: err-e0506-1
  titulo: "Cambiar de nivel con alguien mirando"
  mundo: 07-prestamos
  tema: prestamos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0506
  opciones:
    - "Se asigna `nivel = 2` mientras `r` (un `&nivel`) se sigue usando después (E0506)"
    - "`nivel` no es `mut`"
    - "No se puede imprimir una referencia"
    - "Un entero no se puede tomar prestado"
  correcta: 0
  solucion: |
    `r` se usa en el `println!` final, así que su préstamo cubre la asignación. rustc: `cannot assign to nivel because it is borrowed`.
    - `nivel` sí es `mut`.
    - `println!` imprime referencias sin problema.
    - Cualquier valor se puede tomar prestado.
  etiquetas: ["E0506"]

- id: err-e0507-1
  titulo: "Lo que hay en la caja"
  mundo: 06-ownership
  tema: ownership
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0507
  opciones:
    - "`r` es un préstamo compartido y `r.contenido` intenta mover el `String` fuera de él (E0507)"
    - "No se puede acceder a campos a través de una referencia"
    - "`Caja` necesita `#[derive(Debug)]`"
    - "Hay que escribir `(*r).contenido`"
  correcta: 0
  solucion: |
    Un préstamo no permite llevarse el valor. Arreglos: `&r.contenido`, `r.contenido.clone()` o `mem::take` con `&mut`.
    - Leer campos a través de `&` sí se puede, si no los mueves (o si son `Copy`).
    - `Debug` solo hace falta para imprimir con `{:?}`.
    - `(*r).contenido` es lo mismo y da el mismo error.
  etiquetas: ["E0507", "move", "&"]

- id: err-e0508-1
  titulo: "El primero de la fila"
  mundo: 06-ownership
  tema: ownership
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0508
  opciones:
    - "`nombres[0]` intentaría mover un `String` fuera del array (E0508)"
    - "Los arrays no se pueden indexar con `[0]`"
    - "Los arrays no pueden contener `String`"
    - "Falta indicar el tipo de `primero`"
  correcta: 0
  solucion: |
    Indexar da un lugar dentro del array; moverlo dejaría un hueco. Usa `&nombres[0]` o `.clone()`.
    - Indexar arrays es normal.
    - Un array puede guardar cualquier tipo.
    - El tipo se infiere bien: el problema es el movimiento.
  etiquetas: ["E0508"]

- id: err-e0509-1
  titulo: "Desmontar un registro"
  mundo: 06-ownership
  tema: ownership
  dificultad: dificil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0509
  opciones:
    - "`Registro` implementa `Drop`, así que no se le pueden sacar campos moviéndolos (E0509)"
    - "Los structs no se pueden desestructurar con `let`"
    - "`Drop` obliga a que todos los campos sean `Copy`"
    - "Falta `mut` en `let r`"
  correcta: 0
  solucion: |
    `drop` necesitará el struct entero; moverle un campo lo dejaría a medias. Usa `mem::take(&mut r.texto)`.
    - Desestructurar con `let` es válido en tipos sin `Drop`.
    - `Drop` no exige nada a los campos.
    - `mut` no basta: el patrón sigue moviendo.
  etiquetas: ["E0509", "Drop"]

- id: err-e0515-1
  titulo: "Un regalo que se evapora"
  mundo: 08-lifetimes
  tema: lifetimes
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0515
  opciones:
    - "`s` se destruye al terminar `crear`, y la referencia devuelta apuntaría a nada (E0515)"
    - "Las funciones no pueden devolver `String`"
    - "Falta poner `'static` en `&'a String`"
    - "`String::from` no se puede usar dentro de funciones"
  correcta: 0
  solucion: |
    Ninguna anotación de tiempo de vida puede alargar la vida de `s`. Devuelve `String`.
    - Devolver `String` es justo el arreglo.
    - `'static` no hace que `s` viva más: daría el mismo error.
    - `String::from` funciona en cualquier función.
  etiquetas: ["E0515", "lifetimes"]

- id: err-e0521-1
  titulo: "Un saludo que quiere vivir para siempre"
  mundo: 08-lifetimes
  tema: lifetimes
  dificultad: dificil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0521
  opciones:
    - "La closure lleva un `&str` prestado del parámetro, pero se le exige `'static` (E0521)"
    - "`move` no se puede usar con texto"
    - "Las closures no se pueden meter en una `Box`"
    - "Falta `#[derive(Clone)]`"
  correcta: 0
  solucion: |
    El `&str` solo vale durante la llamada a `preparar`; `'static` pide «para siempre». Arreglo: `let propio = nombre.to_string();` y mover eso.
    - `move` funciona con cualquier tipo.
    - `Box<dyn Fn()>` es la forma normal de guardar closures.
    - No hay ningún tipo propio que derivar.
  etiquetas: ["E0521", "'static"]

- id: err-e0525-1
  titulo: "Despedirse dos veces"
  mundo: 14-closures-e-iteradores
  tema: traits
  dificultad: dificil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0525
  opciones:
    - "La closure mueve `nombre` fuera de sí, así que solo es `FnOnce` y se pide `Fn` (E0525)"
    - "Las closures `move` no pueden llamarse más de una vez nunca"
    - "`F: Fn()` no acepta closures guardadas en variables"
    - "`println!` no se puede usar dentro de una closure"
  correcta: 0
  solucion: |
    Consumir lo capturado gasta la closure. Arreglo: `let prestado = &nombre;`.
    - `move` decide **cómo se captura**, no cuántas veces se llama: una closure `move` que solo mira sigue siendo `Fn`.
    - Da igual que esté en una variable.
    - `println!` funciona en cualquier sitio.
  etiquetas: ["E0525", "FnOnce"]

- id: err-e0560-1
  titulo: "¿Qué edad?"
  mundo: 09-structs-enums-y-patrones
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0560
  opciones:
    - "`Jugador` no tiene un campo `edad` (E0560)"
    - "Los campos numéricos deben ser `u8`"
    - "Falta `mut`"
    - "Hay que crear el struct con `Jugador::new`"
  correcta: 0
  solucion: |
    Solo existen los campos declarados.
    - Cualquier tipo numérico vale.
    - No se modifica nada.
    - La sintaxis literal es correcta.
  etiquetas: ["E0560", "struct"]

- id: err-e0594-1
  titulo: "Subir sin permiso"
  mundo: 07-prestamos
  tema: prestamos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0594
  opciones:
    - "`n` es `&i32` (solo lectura) y `*n += 1` intenta escribir (E0594)"
    - "No se puede usar `*` con enteros"
    - "Las funciones no pueden modificar sus parámetros"
    - "Falta devolver el valor con `return`"
  correcta: 0
  solucion: |
    Para escribir hace falta `&mut i32` y llamar con `subir(&mut x)`.
    - `*n` es válido: lee el valor apuntado.
    - Con `&mut` sí pueden modificar lo que reciben.
    - No hace falta devolver nada si modificas a través de `&mut`.
  etiquetas: ["E0594", "&"]

- id: err-e0596-1
  titulo: "Una lista que no crece"
  mundo: 07-prestamos
  tema: prestamos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0596
  opciones:
    - "`push` necesita `&mut lista`, y `lista` no es `mut` (E0596)"
    - "`Vec::new()` crea un vector de capacidad cero que nunca puede crecer"
    - "Hay que indicar el tipo `Vec<i32>`"
    - "`push` solo existe en arrays"
  correcta: 0
  solucion: |
    Arreglo: `let mut lista`.
    - Un `Vec` vacío crece en cuanto haces `push`.
    - El tipo se infiere del `push(1)`.
    - `push` es de `Vec`; los arrays tienen tamaño fijo.
  etiquetas: ["E0596", "mut"]

- id: err-e0597-1
  titulo: "Fuera del bloque"
  mundo: 08-lifetimes
  tema: lifetimes
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0597
  opciones:
    - "`x` se destruye al cerrar el bloque, pero `r` se usa después (E0597)"
    - "`r` no tiene tipo"
    - "No se puede declarar `let r;` sin valor"
    - "Los bloques `{ }` no pueden contener `let`"
  correcta: 0
  solucion: |
    rustc: `x does not live long enough`. El préstamo tendría que durar hasta el `println!`.
    - El tipo de `r` se infiere de `&x`.
    - `let r;` y asignar más tarde es válido.
    - Los bloques pueden declarar variables (que mueren al cerrar el bloque).
  etiquetas: ["E0597", "lifetimes"]

- id: err-e0599-1
  titulo: "Un contador sin botón"
  mundo: 09-structs-enums-y-patrones
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0599
  opciones:
    - "`Contador` no tiene ningún método `incrementar` (E0599)"
    - "Los structs no pueden tener métodos"
    - "Falta `mut` en `c`"
    - "Hay que llamar a `Contador::incrementar(c)`"
  correcta: 0
  solucion: |
    No hay ningún `impl Contador` con ese método. Hay que escribirlo.
    - Los métodos se añaden con `impl`.
    - `c` ya es `mut`: no es el problema.
    - La sintaxis de ruta da el mismo error si el método no existe.
  etiquetas: ["E0599", "impl"]

- id: err-e0600-1
  titulo: "Negar un texto"
  mundo: 03-valores-y-tipos
  tema: traits
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0600
  opciones:
    - "`!` no se puede aplicar a un `String` (E0600)"
    - "Falta `mut` en `activo`"
    - "`!` solo funciona dentro de `if`"
    - "`\"sí\"` lleva tilde y no se admite"
  correcta: 0
  solucion: |
    `!` es para `bool` y enteros. Compara si quieres un `bool`: `activo != "sí"`.
    - `mut` no tiene que ver.
    - `!` funciona en cualquier expresión.
    - Los textos son UTF-8: la tilde es válida.
  etiquetas: ["E0600"]

- id: err-e0601-1
  titulo: "¿Por dónde empiezo?"
  mundo: 02-tu-primer-programa
  tema: otros
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0601
  opciones:
    - "Falta `fn main()`: el programa no tiene punto de entrada (E0601)"
    - "`println!` no se puede usar fuera de `main`"
    - "Las funciones deben empezar por mayúscula"
    - "Hay que poner `pub fn principal`"
  correcta: 0
  solucion: |
    Todo binario empieza en `main`.
    - `println!` se puede usar en cualquier función.
    - Las funciones se escriben en `snake_case`.
    - `pub` no la convierte en el punto de entrada.
  etiquetas: ["E0601", "main"]

- id: err-e0603-1
  titulo: "El saldo secreto"
  mundo: 12-modulos-crates-y-cargo
  tema: modulos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0603
  opciones:
    - "`saldo_secreto` no es `pub`, así que no se ve fuera de `banco` (E0603)"
    - "Los módulos no pueden tener funciones"
    - "Falta `use banco;`"
    - "Hay que llamar con `banco.saldo_secreto()`"
  correcta: 0
  solucion: |
    Lo de un módulo es privado salvo que lleve `pub`.
    - Los módulos contienen funciones.
    - La ruta `banco::...` ya basta.
    - Las rutas usan `::`, no `.`.
  etiquetas: ["E0603", "pub"]

- id: err-e0605-1
  titulo: "Una lista convertida en número"
  mundo: 03-valores-y-tipos
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0605
  opciones:
    - "`as` no puede convertir un `Vec<u8>` en `u32` (E0605)"
    - "Hay que usar `as usize`"
    - "Los vectores de `u8` son números en Rust"
    - "Falta `mut`"
  correcta: 0
  solucion: |
    `as` es solo para primitivos. Quizá querías `lista.len() as u32`.
    - `as usize` falla igual.
    - Un `Vec` es un struct con puntero, longitud y capacidad.
    - No se modifica nada.
  etiquetas: ["E0605", "as"]

- id: err-e0606-1
  titulo: "Convertir una flecha"
  mundo: 03-valores-y-tipos
  tema: tipos
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0606
  opciones:
    - "`x` es `&u8`; hay que leer el valor con `*x` antes de `as` (E0606)"
    - "`u8` no se puede convertir a `u32`"
    - "Las referencias no se pueden guardar en variables"
    - "Hay que usar `into()` obligatoriamente"
  correcta: 0
  solucion: |
    Arreglo: `*x as u32`.
    - `u8 as u32` es válido: el problema es la referencia.
    - Guardar referencias es normal.
    - `into()` también serviría (`u32::from(*x)`), pero no es obligatorio.
  etiquetas: ["E0606", "as"]

- id: err-e0608-1
  titulo: "La posición cero de un número"
  mundo: 03-valores-y-tipos
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0608
  opciones:
    - "Un `u32` no se puede indexar con `[0]` (E0608)"
    - "Los índices empiezan en 1"
    - "Hay que escribir `edad.0`"
    - "Falta convertir a `usize`"
  correcta: 0
  solucion: |
    Solo se indexan colecciones.
    - Los índices empiezan en 0 en las colecciones.
    - `.0` es para tuplas.
    - El índice ya es un literal válido.
  etiquetas: ["E0608"]

- id: err-e0609-1
  titulo: "La tercera dimensión"
  mundo: 09-structs-enums-y-patrones
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0609
  opciones:
    - "`Punto` no tiene campo `z` (E0609)"
    - "Los campos se leen con `p[z]`"
    - "Hay que derivar `Debug`"
    - "`p` no es `mut`"
  correcta: 0
  solucion: |
    Solo existen `x` e `y`.
    - Los campos se leen con `.`.
    - `{}` sobre un `i32` no necesita `Debug`.
    - Leer no requiere `mut`.
  etiquetas: ["E0609"]

- id: err-e0614-1
  titulo: "Una estrella de más"
  mundo: 07-prestamos
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0614
  opciones:
    - "`n` es un `u32`, no una referencia: no se puede usar `*n` (E0614)"
    - "`*` es la multiplicación y le falta un operando"
    - "Hay que escribir `&n + 1`"
    - "`u32` no admite sumas"
  correcta: 0
  solucion: |
    `*` solo desreferencia referencias y punteros.
    - Delante de un valor es desreferencia, no multiplicación.
    - `&n + 1` suma una referencia y funciona por otras razones, pero no es lo que se pretendía.
    - `u32` se suma sin problema.
  etiquetas: ["E0614", "*"]

- id: err-e0616-1
  titulo: "Mirar la cuenta ajena"
  mundo: 12-modulos-crates-y-cargo
  tema: modulos
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0616
  opciones:
    - "El campo `saldo` es privado del módulo `cuenta` (E0616)"
    - "`Cuenta::nueva` no es pública"
    - "Los structs `pub` tienen todos sus campos públicos"
    - "Falta `mut` en `c`"
  correcta: 0
  solucion: |
    Los campos son privados aunque el struct sea `pub`. Arreglo: método `pub fn saldo(&self)`.
    - `nueva` sí es `pub`.
    - La visibilidad es campo a campo.
    - Solo se lee; `mut` no hace falta.
  etiquetas: ["E0616", "pub"]

- id: err-e0618-1
  titulo: "Llamar a un número"
  mundo: 05-funciones-y-la-pila
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0618
  opciones:
    - "`precio` es un entero y no se puede llamar como una función (E0618)"
    - "Los paréntesis multiplican en Rust"
    - "Falta declarar `total` como `mut`"
    - "`precio` debería ser `u32`"
  correcta: 0
  solucion: |
    Para multiplicar se usa `*`.
    - Los paréntesis tras un nombre son siempre una llamada.
    - `total` no se modifica.
    - El tipo entero no cambia nada.
  etiquetas: ["E0618"]

- id: err-e0621-1
  titulo: "Guardar sin fecha de caducidad"
  mundo: 08-lifetimes
  tema: lifetimes
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0621
  opciones:
    - "`texto` tiene un tiempo de vida anónimo y la lista exige `'a` (E0621)"
    - "`push` no acepta `&str`"
    - "`Vec::new()` necesita el tipo explícito"
    - "No se puede pasar `&mut Vec` a una función"
  correcta: 0
  solucion: |
    Arreglo: `texto: &'a str`.
    - `push` acepta `&'a str` en esa lista.
    - El tipo se infiere de la función.
    - Pasar `&mut Vec` es lo normal para modificar una lista ajena.
  etiquetas: ["E0621", "lifetimes"]

- id: err-e0624-1
  titulo: "Un motor que no arranca"
  mundo: 12-modulos-crates-y-cargo
  tema: modulos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0624
  opciones:
    - "El método `calentar` no es `pub` (E0624)"
    - "`Motor` es un struct sin campos y no puede tener métodos"
    - "Hay que escribir `motor::Motor::new()`"
    - "Falta `&mut self`"
  correcta: 0
  solucion: |
    Los métodos son privados por defecto.
    - Un struct unitario puede tener métodos.
    - `motor::Motor` ya crea el valor (es unitario).
    - `&self` basta: no modifica nada.
  etiquetas: ["E0624", "pub"]

- id: err-e0658-1
  titulo: "Un bloque del futuro"
  mundo: 21-el-compilador-por-dentro
  tema: otros
  dificultad: dificil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0658
  opciones:
    - "Los bloques `try { }` aún no son estables en Rust 1.99.1 (E0658)"
    - "`?` no se puede usar con `parse`"
    - "Falta indicar el tipo de error"
    - "`try` no es una palabra del lenguaje"
  correcta: 0
  solucion: |
    Solo funcionan en *nightly* con `#![feature(try_blocks)]`. Alternativa: una función con `?`.
    - `?` funciona con `Result`.
    - El tipo está anotado en `r`.
    - `try` es una palabra reservada para esto.
  etiquetas: ["E0658", "nightly"]

- id: err-e0716-1
  titulo: "Palabras de un texto fantasma"
  mundo: 08-lifetimes
  tema: lifetimes
  dificultad: dificil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0716
  opciones:
    - "El `String` es un temporal que muere al final de la sentencia, y `palabras` apunta dentro de él (E0716)"
    - "`split` no se puede usar con `String`"
    - "`collect` no sabe en qué colección recoger"
    - "Un `Vec<&str>` no se puede imprimir con `{:?}`"
  correcta: 0
  solucion: |
    Guarda el `String` en una variable para que viva hasta el final del bloque.
    - `split` funciona sobre `String` (a través de `&str`).
    - El tipo `Vec<&str>` está anotado, así que `collect` sabe qué crear.
    - `Vec<&str>` implementa `Debug`.
  etiquetas: ["E0716", "temporales"]

- id: err-e0728-1
  titulo: "Esperar en main"
  mundo: 18-async
  tema: otros
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0728
  opciones:
    - "`main` no es `async`, así que dentro no se puede usar `.await` (E0728)"
    - "`async fn` no puede devolver `u32`"
    - "Falta `use std::future::Future;`"
    - "`.await` se escribe `await()`"
  correcta: 0
  solucion: |
    `.await` solo existe dentro de código `async`, y hace falta un ejecutor para arrancar.
    - Una `async fn` puede devolver cualquier tipo.
    - No hace falta importar `Future` para usar `.await`.
    - Es una palabra clave postfija: `.await` sin paréntesis.
  etiquetas: ["E0728", "async"]

- id: err-e0746-1
  titulo: "Un animal de tamaño desconocido"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0746
  opciones:
    - "`dyn Animal` no tiene tamaño conocido; hay que devolver `Box<dyn Animal>` o `impl Animal` (E0746)"
    - "Los traits no se pueden devolver de ninguna forma"
    - "`Perro` debería tener campos"
    - "Falta `pub trait`"
  correcta: 0
  solucion: |
    El tamaño del retorno debe conocerse al compilar.
    - Con `Box` o `impl` sí se puede.
    - Un struct sin campos implementa traits sin problema.
    - La visibilidad no influye.
  etiquetas: ["E0746", "dyn"]

- id: err-vida-insuficiente-1
  titulo: "Para siempre es mucho tiempo"
  mundo: 08-lifetimes
  tema: lifetimes
  dificultad: dificil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/vida-insuficiente
  opciones:
    - "La closure contiene `x` (vida `'1`) y se exige `'static`: el compilador dice `lifetime may not live long enough`"
    - "Las closures no se pueden devolver en una `Box`"
    - "Falta `mut` en la closure"
    - "`println!` no puede usarse en closures `move`"
  correcta: 0
  solucion: |
    La promesa `'static` es mayor que la vida de `x`. Arreglos: `+ '_` o copiar el valor (`let copia = *x;`).
    - Devolver `Box<dyn Fn()>` es habitual.
    - La closure no modifica nada.
    - `println!` funciona dentro de closures.
  etiquetas: ["lifetimes", "'static"]
