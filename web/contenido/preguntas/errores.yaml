    - "Las variables no se pueden imprimir sin `{:?}`"
    - "`7` debe escribirse `7i32`"
    - "Falta `mut`"
  correcta: 0
  solucion: |
    rustc incluso sugiere el nombre parecido.
    - `{}` imprime enteros.
    - El tipo se infiere.
    - Nadie modifica la variable.
  etiquetas: ["E0425"]

- id: err-e0428-1
  titulo: "Dos puntos iguales"
  mundo: 12-modulos-crates-y-cargo
  tema: modulos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
