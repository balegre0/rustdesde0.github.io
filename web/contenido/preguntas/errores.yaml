# Preguntas «no-compila» de las fichas de errores (CONTENIDO.md §7.1). Código y errores verificados con rustc 1.99.1, ed. 2024.

- id: err-e0004-1
  titulo: "El ámbar olvidado"
  mundo: 09-structs-enums-y-patrones
  tema: patrones
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0004
  opciones:
    - "El `match` no cubre `Semaforo::Ambar` (E0004)"
    - "Los enums no se pueden recorrer en un `for`"
    - "Falta `#[derive(Debug)]`"
    - "`match` debe terminar en `;`"
  correcta: 0
  solucion: |
    Un `match` debe cubrir todas las variantes.
    - Recorrer un array de enums es válido.
    - No se imprime con `{:?}`.
    - El `;` va tras el `let`, y ya está.
  etiquetas: ["E0004", "match"]

- id: err-e0005-1
  titulo: "Un let optimista"
  mundo: 09-structs-enums-y-patrones
  tema: patrones
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0005
  opciones:
    - "`let Some(n)` no encaja si el valor es `None`, y `let` no tiene alternativa (E0005)"
    - "`Option` no se puede desestructurar"
    - "Falta `mut n`"
    - "Hay que escribir `let n = Some(quiza);`"
  correcta: 0
  solucion: |
    Usa `let ... else`, `if let` o `match`.
    - `Option` se desestructura en patrones que admiten fallo.
    - `mut` no tiene que ver.
    - Eso crearía un `Option<Option<i32>>`.
  etiquetas: ["E0005", "let else"]

- id: err-e0015-1
  titulo: "Una constante con memoria"
  mundo: 04-expresiones-y-control
  tema: otros
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0015
  opciones:
    - "`String::from` no es una `const fn`: no se puede llamar al compilar (E0015)"
    - "Las constantes no pueden ser textos"
    - "Las constantes se escriben en minúsculas"
    - "Falta `static`"
  correcta: 0
  solucion: |
    Usa `const SALUDO: &str = "hola";`.
    - Pueden ser `&str`.
    - Se escriben en MAYÚSCULAS por convención, y eso no da error.
    - Con `static` pasa lo mismo.
  etiquetas: ["E0015", "const"]

- id: err-e0023-1
  titulo: "Un rectángulo sin alto"
  mundo: 09-structs-enums-y-patrones
  tema: patrones
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0023
  opciones:
    - "La variante tiene dos campos y el patrón solo uno (E0023)"
    - "Las variantes no pueden tener dos valores"
    - "Falta el brazo `_`"
    - "Hay que escribir `Forma::Rect { ancho }`"
  correcta: 0
  solucion: |
    Nombra los dos o usa `_`/`..`.
    - Una variante puede llevar varios valores.
    - Con una sola variante, el `match` ya es exhaustivo.
    - Las llaves son para variantes con campos con nombre.
  etiquetas: ["E0023", "patrones"]

- id: err-e0029-1
  titulo: "Textos en un rango"
  mundo: 09-structs-enums-y-patrones
  tema: patrones
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0029
  opciones:
    - "Los patrones de rango solo admiten números y `char`, no `&str` (E0029)"
    - "Falta el brazo `_`"
    - "Los rangos en patrones se escriben `..` sin `=`"
    - "No se puede hacer `match` con textos"
  correcta: 0
  solucion: |
    Usa `match nombre.chars().next() { Some('a'..='m') => ... }`.
    - El `_` ya está.
    - `..=` es la forma correcta en patrones.
    - `match` con textos literales (`"ana" =>`) sí funciona; con rangos, no.
  etiquetas: ["E0029", "patrones"]

- id: err-e0038-1
  titulo: "Duplicar a ciegas"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: dificil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0038
  opciones:
    - "`duplicar` devuelve `Self`, que no se conoce a través de `dyn Clonable` (E0038)"
    - "`Box` no puede contener traits"
    - "Falta `#[derive(Clone)]`"
    - "Los `Vec` no pueden contener `Box`"
  correcta: 0
  solucion: |
    Arreglo: devolver `Box<dyn Clonable>`.
    - `Box<dyn Trait>` es la forma normal de los objetos de trait.
    - Derivar no cambia la firma del trait.
    - Un `Vec<Box<...>>` es habitual.
  etiquetas: ["E0038", "dyn"]

- id: err-e0040-1
  titulo: "Cerrar a mano"
  mundo: 06-ownership
  tema: traits
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0040
  opciones:
    - "No se puede llamar a `drop()` como método; hay que usar la función `drop(a)` (E0040)"
    - "`Archivo` no implementa `Drop`"
    - "`a` debería ser `mut`"
    - "`drop` solo existe para `String`"
  correcta: 0
  solucion: |
    El compilador llama al destructor solo; `drop(a)` mueve `a` y lo destruye una vez.
    - `Archivo` sí implementa `Drop`.
    - `mut` no lo arregla.
    - `drop` sirve para cualquier valor.
  etiquetas: ["E0040", "Drop"]

- id: err-e0046-1
  titulo: "Una figura a medias"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0046
  opciones:
    - "El `impl` no define `nombre`, que el trait exige (E0046)"
    - "Los traits no pueden tener dos métodos"
    - "`area` debe devolver `f32`"
    - "Falta `pub` en el trait"
  correcta: 0
  solucion: |
    Todo método sin cuerpo por defecto es obligatorio.
    - Un trait puede tener muchos métodos.
    - La firma de `area` coincide.
    - Dentro del mismo módulo no hace falta `pub`.
  etiquetas: ["E0046", "traits"]

- id: err-e0053-1
  titulo: "Escalar con el tipo equivocado"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0053
  opciones:
    - "El parámetro `factor` es `i32` en el `impl` y `f64` en el trait (E0053)"
    - "No se pueden multiplicar `f64`"
    - "Los traits no admiten parámetros"
    - "Falta `pub fn`"
  correcta: 0
  solucion: |
    Las firmas deben coincidir exactamente.
    - Multiplicar `f64` es normal.
    - Los métodos de traits pueden tener parámetros.
    - Los métodos de un `impl` de trait no llevan `pub`.
  etiquetas: ["E0053", "traits"]

- id: err-e0061-1
  titulo: "Saludar, ¿cuántas veces?"
  mundo: 05-funciones-y-la-pila
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0061
  opciones:
    - "`saludar` pide dos argumentos y solo recibe uno (E0061)"
    - "`veces` vale `1` por defecto"
    - "`for _ in` no es válido"
    - "Falta `return`"
  correcta: 0
  solucion: |
    No hay argumentos por defecto en Rust.
    - No existen valores por defecto en parámetros.
    - `_` ignora la variable del bucle: es válido.
    - La función no devuelve nada.
  etiquetas: ["E0061", "funciones"]

- id: err-e0063-1
  titulo: "Un jugador sin vidas"
  mundo: 09-structs-enums-y-patrones
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0063
  opciones:
    - "Falta dar valor al campo `vidas` (E0063)"
    - "`vidas` vale `0` automáticamente"
    - "`u8` no se puede usar en structs"
    - "Hay que poner los campos en orden alfabético"
  correcta: 0
  solucion: |
    Todos los campos deben inicializarse.
    - Rust no rellena con ceros.
    - `u8` es un tipo normal.
    - El orden de los campos al crear da igual.
  etiquetas: ["E0063", "struct"]

- id: err-e0070-1
  titulo: "Al revés"
  mundo: 03-valores-y-tipos
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0070
  opciones:
    - "`1` no es un lugar: no se le puede asignar nada (E0070)"
    - "`x` no es `mut`"
    - "Falta `let`"
    - "Los literales son `const` y hay que declararlos"
  correcta: 0
  solucion: |
    A la izquierda de `=` va una variable, un campo o similar.
    - Aunque `x` fuera `mut`, `1 = x` seguiría siendo inválido.
    - `let` declara, no arregla esto.
    - Los literales no se declaran.
  etiquetas: ["E0070"]

- id: err-e0072-1
  titulo: "La lista infinita"
  mundo: 15-punteros-inteligentes
  tema: tipos
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0072
  opciones:
    - "`Lista` se contiene a sí misma y su tamaño sería infinito; hace falta `Box<Lista>` (E0072)"
    - "Los enums no pueden tener datos"
    - "Falta el caso `Fin`"
    - "Los enums recursivos no existen en Rust"
  correcta: 0
  solucion: |
    Un `Box` tiene tamaño fijo y rompe el ciclo.
    - Los enums pueden llevar datos en sus variantes.
    - `Fin` ya está.
    - Con `Box` sí existen.
  etiquetas: ["E0072", "Box"]

- id: err-e0080-1
  titulo: "Un tamaño que no cabe"
  mundo: 03-valores-y-tipos
  tema: otros
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0080
  opciones:
    - "`200 + 100` desborda un `u8` (máximo 255) y la constante no se puede calcular (E0080)"
    - "Las constantes no admiten sumas"
    - "El programa compila y entra en pánico al ejecutar"
    - "`u8` no existe"
  correcta: 0
  solucion: |
    Las `const` se evalúan al compilar, así que el desbordamiento es un error de compilación.
    - Las sumas se permiten.
    - No llega a ejecutarse: falla antes.
    - `u8` es el entero sin signo de 8 bits.
  etiquetas: ["E0080", "overflow", "const"]

- id: err-e0106-1
  titulo: "¿La más larga de quién?"
  mundo: 08-lifetimes
  tema: lifetimes
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0106
  opciones:
    - "La función devuelve una referencia y hay dos de entrada: hay que indicar con `'a` de cuál puede venir (E0106)"
    - "No se pueden comparar longitudes de `&str`"
    - "Las funciones no pueden devolver `&str`"
    - "Hay que escribir `-> String` obligatoriamente"
  correcta: 0
  solucion: |
    Con dos referencias de entrada no hay elisión posible. `<'a>` en las tres referencias lo resuelve.
    - `len()` funciona sobre `&str`.
    - Devolver `&str` es normal con su tiempo de vida.
    - `String` también funcionaría, pero obligaría a copiar el texto: no es obligatorio.
  etiquetas: ["E0106", "lifetimes", "elisión"]

- id: err-e0117-1
  titulo: "Mostrar algo que no es tuyo"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0117
  opciones:
    - "Ni `Display` ni `Vec<u8>` son de tu crate: lo prohíbe la regla huérfana (E0117)"
    - "`Vec<u8>` no se puede imprimir"
    - "Falta `#[derive(Display)]`"
    - "`write!` no funciona en `fmt`"
  correcta: 0
  solucion: |
    Arreglo: un *newtype* propio, `struct Bytes(Vec<u8>)`.
    - `Vec<u8>` se imprime con `{:?}`.
    - `Display` no se puede derivar.
    - `write!` es justo lo que se usa en `fmt`.
  etiquetas: ["E0117", "orphan"]

- id: err-e0119-1
  titulo: "Dos formas de describir un 5"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: dificil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0119
  opciones:
    - "La implementación genérica para todo `T: Debug` ya incluye `i32` (E0119)"
    - "Los traits no admiten genéricos"
    - "`format!` no acepta `{:?}`"
    - "Hay que poner `pub` en las dos implementaciones"
  correcta: 0
  solucion: |
    Un tipo solo puede tener una implementación de cada trait.
    - Los traits genéricos son normales.
    - `{:?}` funciona con `Debug`.
    - La visibilidad no influye.
  etiquetas: ["E0119", "coherencia"]

- id: err-e0133-1
  titulo: "Leer por un puntero crudo"
  mundo: 20-unsafe-y-ub
  tema: otros
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0133
  opciones:
    - "Desreferenciar un puntero crudo requiere un bloque `unsafe` (E0133)"
    - "`&raw const` no existe"
    - "Los punteros crudos no se pueden crear en código seguro"
    - "Falta `mut` en `x`"
  correcta: 0
  solucion: |
    Crear el puntero es seguro; leerlo, no. Envuelve `*p` en `unsafe`.
    - `&raw const` es estable desde 1.82.
    - Crearlos sí es seguro.
    - Solo se lee.
  etiquetas: ["E0133", "unsafe"]

- id: err-e0184-1
  titulo: "Una ficha que se despide"
  mundo: 06-ownership
  tema: traits
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0184
  opciones:
    - "`Ficha` es `Copy` y además implementa `Drop`, y eso está prohibido (E0184)"
    - "`Drop` no puede imprimir"
    - "Los structs de tupla no pueden ser `Copy`"
    - "Falta `pub`"
  correcta: 0
  solucion: |
    Un tipo con destructor no puede copiarse en silencio. Quita `Copy`.
    - `drop` puede hacer cualquier cosa, también imprimir.
    - Un struct de tupla de `u32` sí puede ser `Copy` (si no tiene `Drop`).
    - La visibilidad no influye.
  etiquetas: ["E0184", "Copy", "Drop"]

- id: err-e0204-1
  titulo: "Un usuario fotocopiable"
  mundo: 06-ownership
  tema: traits
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0204
  opciones:
    - "`nombre: String` no es `Copy`, así que `Usuario` tampoco puede serlo (E0204)"
    - "`Copy` y `Clone` no se pueden derivar juntos"
    - "Los structs nunca pueden ser `Copy`"
    - "Falta `mut`"
  correcta: 0
  solucion: |
    Un tipo es `Copy` solo si todos sus campos lo son.
    - `Clone, Copy` juntos es lo normal (Copy exige Clone).
    - Un struct con solo números sí puede ser `Copy`.
    - `mut` no tiene que ver.
  etiquetas: ["E0204", "Copy"]

- id: err-e0261-1
  titulo: "Una vista sin fecha"
  mundo: 08-lifetimes
  tema: lifetimes
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0261
  opciones:
    - "`'a` se usa en el campo pero no se declara en `struct Vista<'a>` (E0261)"
    - "Los structs no pueden guardar referencias"
    - "`'a` es una palabra reservada"
    - "Hay que usar `'static` siempre en structs"
  correcta: 0
  solucion: |
    Los tiempos de vida se declaran como los genéricos.
    - Los structs pueden guardar referencias si declaran su tiempo de vida.
    - `'a` es un nombre cualquiera.
    - `'static` solo valdría para textos que viven todo el programa.
  etiquetas: ["E0261", "lifetimes"]

- id: err-e0277-1
  titulo: "Imprimir un punto"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0277
  opciones:
    - "`Punto` no implementa `Display`, que es lo que pide `{}` (E0277)"
    - "Los structs no se pueden imprimir de ninguna forma"
    - "Falta `mut` en `p`"
    - "`println!` solo acepta textos"
  correcta: 0
  solucion: |
    Implementa `Display`, o deriva `Debug` e imprime con `{:?}`.
    - Se pueden imprimir en cuanto implementan el trait.
    - Imprimir no modifica.
    - `println!` acepta todo lo que implemente el trait del formato.
  etiquetas: ["E0277", "Display"]

- id: err-e0277-2
  titulo: "Una interrogación fuera de sitio"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila el segundo ejemplo de la ficha (`fn leer() -> i32` con `?`)?"
  ej: errores/E0277-interrogacion
  opciones:
    - "`?` solo se puede usar en funciones que devuelven `Result` u `Option`, y `leer` devuelve `i32` (E0277)"
    - "`parse` no puede fallar"
    - "`?` solo funciona con `Option`"
    - "Hay que escribir `parse::<i32>()`"
  correcta: 0
  solucion: |
    `?` devuelve el error al que llama, así que la función debe poder devolver un error. Arreglo: `-> Result<i32, ParseIntError>` y `Ok(n)`.
    - `parse` puede fallar: por eso devuelve `Result`.
    - `?` funciona con `Result` y con `Option`.
    - El tipo ya se conoce por la anotación `n: i32`.
  etiquetas: ["E0277", "?"]

- id: err-e0282-1
  titulo: "Una lista de… ¿qué?"
  mundo: 03-valores-y-tipos
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0282
  opciones:
    - "Nada indica el tipo de los elementos de `lista` (E0282)"
    - "`Vec::new()` necesita una capacidad"
    - "Un `Vec` vacío no tiene `len()`"
    - "Falta `mut`"
  correcta: 0
  solucion: |
    Arreglo: `let lista: Vec<String> = Vec::new();`.
    - `new()` no recibe nada (`with_capacity` sí).
    - `len()` de un vector vacío es `0`.
    - Solo se lee la longitud.
  etiquetas: ["E0282", "inferencia"]

- id: err-e0283-1
  titulo: "Una suma sin tipo"
  mundo: 14-closures-e-iteradores
  tema: tipos
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0283
  opciones:
    - "`sum()` puede devolver varios tipos y nada dice cuál es `total` (E0283)"
    - "No se pueden sumar `u32`"
    - "`split` devuelve números"
    - "`map` no admite closures"
  correcta: 0
  solucion: |
    Arreglo: `let total: u32` o `.sum::<u32>()`.
    - Sumar `u32` está implementado.
    - `split` devuelve `&str`.
    - `map` está hecho para closures.
  etiquetas: ["E0283", "inferencia", "iteradores"]

- id: err-e0308-1
  titulo: "El doble de un texto"
  mundo: 03-valores-y-tipos
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0308
  opciones:
    - "`doble` espera un `i32` y recibe un `&str` (E0308)"
    - "`\"21\"` es un número y Rust lo convierte solo"
    - "Falta `return` en `doble`"
    - "`n * 2` puede desbordar"
  correcta: 0
  solucion: |
    Rust nunca convierte texto en número automáticamente: usa `texto.parse()`.
    - `"21"` entre comillas es un `&str`.
    - La última expresión sin `;` ya es el valor devuelto.
    - El desbordamiento se comprueba al ejecutar, no al compilar.
  etiquetas: ["E0308", "tipos"]

- id: err-e0369-1
  titulo: "Sumar dinero"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0369
  opciones:
    - "`Dinero` no implementa `Add`, que es lo que usa `+` (E0369)"
    - "Los `u64` no se pueden sumar"
    - "Falta `mut` en `total`"
    - "Hay que escribir `a.centimos + b`"
  correcta: 0
  solucion: |
    Arreglo: `impl Add for Dinero` con `type Output`.
    - Los `u64` sí se suman: los structs, no.
    - `total` no se modifica.
    - `u64 + Dinero` tampoco existe.
  etiquetas: ["E0369", "operadores"]

- id: err-e0373-1
  titulo: "Una closure con equipaje prestado"
  mundo: 14-closures-e-iteradores
  tema: lifetimes
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0373
  opciones:
    - "La closure toma prestado `base`, que muere al terminar `contador`; falta `move` (E0373)"
    - "Las funciones no pueden devolver closures"
    - "`impl Fn() -> u32` debería ser `fn() -> u32`"
    - "`base` tendría que ser `static`"
  correcta: 0
  solucion: |
    `move || base + 1` copia `base` dentro de la closure.
    - Devolver closures con `impl Fn` es normal.
    - Un puntero `fn` no puede capturar variables.
    - No hace falta una `static`: basta con `move`.
  etiquetas: ["E0373", "closures", "move"]

- id: err-e0381-1
  titulo: "Un total por si acaso"
  mundo: 04-expresiones-y-control
  tema: ownership
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0381
  opciones:
    - "Si `hay_datos` es `false`, `total` nunca recibe valor (E0381)"
    - "No se puede declarar una variable sin valor"
    - "`total` debería ser `mut`"
    - "El compilador sabe que `hay_datos` es `false` y avisa de código muerto"
  correcta: 0
  solucion: |
    Hay un camino sin asignación. Arreglo: rama `else` o `let total = if ... else ...`.
    - Declarar sin valor está permitido si se asigna antes de usar.
    - Una sola asignación no necesita `mut`.
    - El compilador no evalúa la condición: revisa todos los caminos.
  etiquetas: ["E0381"]

- id: err-e0382-1
  titulo: "Hola dos veces"
  mundo: 06-ownership
  tema: ownership
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0382
  opciones:
    - "`saludo` se movió a `otro` y ya no se puede usar (E0382)"
    - "`println!` no acepta variables de tipo `String`"
    - "Falta `mut` en `let saludo`"
    - "No se pueden tener dos variables con el mismo texto"
  correcta: 0
  solucion: |
    `let otro = saludo;` **mueve** la propiedad: `saludo` deja de ser válida. rustc dice `borrow of moved value: saludo`.
    - `println!` acepta cualquier `String` sin problema.
    - `mut` sirve para modificar, y aquí nadie modifica nada.
    - Dos variables pueden guardar textos iguales: el problema es compartir **un mismo** valor.
  etiquetas: ["E0382", "move"]

- id: err-e0382-2
  titulo: "¿Copia o movimiento?"
  mundo: 06-ownership
  tema: ownership
  dificultad: media
  tipo: no-compila
  enunciado: "Este programa no compila. ¿Qué cambio lo arregla manteniendo las dos variables utilizables?"
  ej: errores/E0382
  opciones:
    - "Cambiar `let otro = saludo;` por `let otro = saludo.clone();`"
    - "Cambiar `let otro = saludo;` por `let mut otro = saludo;`"
    - "Imprimir `otro` antes que `saludo`"
    - "Declarar `saludo` como `const`"
  correcta: 0
  solucion: |
    `clone()` crea un `String` nuevo con su propia memoria; así cada variable es dueña de lo suyo.
    - `mut` no cambia quién es el dueño.
    - El orden de los `println!` da igual: `saludo` ya se movió en la línea 3.
    - `const` no admite `String::from` (no es una función `const`).
  etiquetas: ["E0382", "clone"]

- id: err-e0384-1
  titulo: "Perder una vida"
  mundo: 03-valores-y-tipos
  tema: ownership
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0384
  opciones:
    - "`vidas` no es `mut` y se le asigna un valor nuevo (E0384)"
    - "No se puede imprimir una variable dos veces"
    - "`2` y `3` son de tipos distintos"
    - "Hay que usar `vidas -= 1`"
  correcta: 0
  solucion: |
    Las variables son inmutables salvo que pongas `mut`.
    - Imprimir varias veces no la cambia.
    - Los dos literales son `i32`.
    - `vidas -= 1` también es una asignación y da el mismo error.
  etiquetas: ["E0384", "mut"]

- id: err-e0392-1
  titulo: "Una etiqueta sin usar"
  mundo: 13-traits-y-genericos
  tema: tipos
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0392
  opciones:
    - "`T` no aparece en ningún campo de `Id` (E0392)"
    - "Los structs genéricos no pueden tener campos `u64`"
    - "Hay que escribir `Id<T: Clone>`"
    - "`size_of` no se puede llamar con genéricos"
  correcta: 0
  solucion: |
    Arreglo: `_tipo: PhantomData<T>` (0 bytes).
    - Los campos pueden ser de cualquier tipo.
    - Un límite no hace que `T` se use.
    - `size_of::<Id<String>>()` es válido.
  etiquetas: ["E0392", "PhantomData"]

- id: err-e0407-1
  titulo: "Un adiós que sobra"
  mundo: 13-traits-y-genericos
  tema: traits
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0407
  opciones:
    - "`adios` no está declarado en el trait `Saludo` (E0407)"
    - "Un struct no puede tener dos métodos"
    - "Falta `&mut self` en `adios`"
    - "`Robot` necesita campos"
  correcta: 0
  solucion: |
    En un `impl Trait for Tipo` solo va lo del trait. Pon `adios` en `impl Robot`.
    - Un tipo puede tener muchos métodos.
    - `&self` es correcto.
    - Un struct unitario puede implementar traits.
  etiquetas: ["E0407", "traits"]

- id: err-e0408-1
  titulo: "Texto o número, a la vez"
  mundo: 09-structs-enums-y-patrones
  tema: patrones
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0408
  opciones:
    - "`t` solo existe en una alternativa y `n` en la otra (E0408)"
    - "No se puede usar `|` en un `match`"
    - "Falta el brazo `_`"
    - "`String` e `i32` no pueden estar en el mismo enum"
  correcta: 0
  solucion: |
    Cada alternativa de un `|` debe ligar las mismas variables. Separa los brazos.
    - `|` en patrones es válido.
    - Las dos variantes ya están cubiertas.
    - Un enum puede llevar datos de tipos distintos en cada variante.
  etiquetas: ["E0408", "patrones"]

- id: err-e0423-1
  titulo: "Un punto sin coordenadas"
  mundo: 09-structs-enums-y-patrones
  tema: modulos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila este programa?"
  ej: errores/E0423
  opciones:
    - "`Punto` es un tipo con campos; hay que crearlo con `Punto { x: ..., y: ... }` (E0423)"
    - "Hay que escribir `Punto()`"
    - "Falta `#[derive(Default)]`"
    - "Los structs se crean con `new Punto`"
  correcta: 0
  solucion: |
    Un struct con campos se construye escribiendo sus campos.
    - `Punto()` sería para un struct de tupla.
    - `Default` permitiría `Punto::default()`, pero no `Punto` a secas.
    - En Rust no existe la palabra `new` como operador.
  etiquetas: ["E0423", "struct"]

- id: err-e0425-1
  titulo: "Una letra bailada"
  mundo: 02-tu-primer-programa
