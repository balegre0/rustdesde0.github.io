# Banco de preguntas del mundo 11 — Colecciones y texto (CONTENIDO.md §7.1).
# Todo código citado está en ejemplos/m11/*.rs, compilado y ejecutado con rustc 1.99.1, edición 2024 (wasm32-wasip1).

- id: m11-vec-push-pop-insert
  titulo: "push, pop e insert"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/vec-predice
  opciones:
    - "`[5, 10, 20, 30] Some(40) 4`"
    - "`[5, 10, 20, 30, 40] None 5`"
    - "`[10, 20, 30, 5] Some(40) 4`"
    - "`[5, 10, 20, 30] 40 4`"
  correcta: 0
  solucion: |
    `push(40)` añade al final; `pop()` lo quita y lo devuelve envuelto en `Some` (el vector podría estar vacío); `insert(0, 5)` mete el 5 al principio y desplaza el resto.
    - `pop` sí quitó el 40.
    - `insert(0, …)` inserta en la posición 0, no al final.
    - `pop` devuelve `Option<T>`: se imprime `Some(40)`.
  etiquetas: ["Vec", "Option"]

- id: m11-capacidad-crece
  titulo: "Cómo crece la capacidad"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: media
  tipo: predice
  enunciado: "¿Qué imprime (con la biblioteca estándar de Rust 1.99)?"
  ej: m11/capacidad-predice
  opciones:
    - "`0 4 8 (len 5)`"
    - "`0 1 5 (len 5)`"
    - "`1 2 8 (len 5)`"
    - "`0 1 2 (len 5)`"
  correcta: 0
  solucion: |
    Un `Vec::new()` no reserva nada (capacidad 0). El primer `push` de un elemento pequeño reserva 4 de golpe, y cuando se llena, la capacidad se **duplica** (4 → 8). Así, añadir n elementos cuesta, en promedio, un tiempo constante por elemento.
    - No crece de uno en uno: sería lentísimo (copiaría todo en cada `push`).
    - `Vec::new()` empieza en 0, sin reservar.
  etiquetas: ["Vec", "capacidad"]

- id: m11-slices-suma
  titulo: "Una función para todos"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/slices-predice
  opciones:
    - "`15 5 60`"
    - "`15 9 60`"
    - "`15 6 60`"
    - "No compila: `suma` pide un slice y se le pasa un `Vec`"
  correcta: 0
  solucion: |
    `&v[1..3]` son los elementos 1 y 2 (valores 2 y 3): suman 5. `&v` se convierte solo en `&[i32]`, y `&a` también.
    - `1..3` excluye el índice 3.
    - Un `&Vec<i32>` se convierte en `&[i32]` automáticamente (coerción por deref).
  etiquetas: ["slices", "&[T]"]

- id: m11-iterar-mut
  titulo: "Modificar recorriendo"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/iterar-predice
  opciones:
    - "`[10, 20, 30] 60`"
    - "`[1, 2, 3] 6`"
    - "`[10, 20, 30] 6`"
    - "No compila: `x` es inmutable"
  correcta: 0
  solucion: |
    `for x in &mut v` da un `&mut i32` por elemento, y `*x *= 10` modifica el vector de verdad. Después se suman los valores nuevos.
  etiquetas: ["Vec", "&mut", "for"]

- id: m11-utf8-len
  titulo: "Bytes y caracteres"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/utf8-predice
  opciones:
    - "`4 3`"
    - "`3 3`"
    - "`3 4`"
    - "`6 3`"
  correcta: 0
  solucion: |
    `len()` cuenta **bytes** de UTF-8: «a» (1) + «ñ» (2) + «o» (1) = 4. `chars().count()` cuenta valores escalares de Unicode: 3.
  etiquetas: ["UTF-8", "str"]

- id: m11-string-y-str
  titulo: "Literal, String y vista"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/string-predice
  opciones:
    - "`hola | hola, mundo | hola`"
    - "`hola, mundo | hola, mundo | hola`"
    - "`hola | hola, mundo | hola,`"
    - "No compila: `literal` se movió a `propio`"
  correcta: 0
  solucion: |
    `String::from(literal)` **copia** el texto a un `String` nuevo; el literal no cambia. `&propio[..4]` presta los 4 primeros bytes: «hola».
    - Un `&str` es `Copy`: pasarlo a `String::from` no lo mueve.
  etiquetas: ["String", "&str"]

- id: m11-concatenar
  titulo: "Sumar textos"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: media
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/construir-predice
  opciones:
    - "`pan con queso / queso`"
    - "No compila: `b` se movió"
    - "`pan con queso / pan`"
    - "No compila: no se puede sumar `String` y `&str`"
  correcta: 0
  solucion: |
    `a + " con " + &b` **consume** `a` (el operador `+` recibe el `String` de la izquierda por valor y le añade un `&str`) pero solo **presta** `b`. Por eso `b` se puede usar después y `a` no.
  etiquetas: ["String", "+", "ownership"]

- id: m11-usar-tras-suma
  titulo: "¿Dónde está a?"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no compila?"
  ej: m11/usar-tras-suma
  opciones:
    - "`a + &b` mueve `a` dentro de la suma (el `String` de la izquierda se reutiliza), así que `a` ya no se puede usar (E0382)"
    - "No se puede sumar dos `String`"
    - "`b` se movió"
    - "`c` no es `mut`"
  correcta: 0
  solucion: |
    El `+` de `String` tiene la firma `fn add(self, s: &str) -> String`: se queda con `self` para añadir al final sin copiar. Si necesitas `a` después, usa `format!("{a}{b}")`, que solo presta.
  etiquetas: ["E0382", "String"]

- id: m11-suma-strings
  titulo: "Falta un &"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Qué hay que cambiar para que compile?"
  ej: m11/suma-strings
  opciones:
    - "Prestar el segundo `String`: `nombre + \" \" + &apellido` (E0308: se esperaba `&str`)"
    - "Declarar `nombre` como `mut`"
    - "Usar `.clone()` en `nombre`"
    - "Cambiar `+` por `,`"
  correcta: 0
  solucion: |
    A la derecha de `+` tiene que ir un `&str`. `apellido` es un `String`: prestándolo (`&apellido`) se convierte en `&str` por deref.
  etiquetas: ["E0308", "String", "+"]

- id: m11-indexar-str
  titulo: "s[0] no existe"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: media
  tipo: no-compila
  enunciado: "¿Por qué no se puede escribir `s[0]` con un `String`?"
  ej: m11/indexar-str
  opciones:
    - "Porque en UTF-8 un carácter puede ocupar de 1 a 4 bytes: `s[0]` sería ambiguo (¿un byte o un carácter?) y no sería O(1). `String` no implementa `Index<usize>` (E0277)"
    - "Porque los `String` están vacíos al crearlos"
    - "Porque hay que escribir `s(0)`"
    - "Porque `s` no es `mut`"
  correcta: 0
  solucion: |
    Rust prefiere que elijas: `s.as_bytes()[0]` (el primer byte), `s.chars().next()` (el primer carácter) o `&s[0..1]` (un trozo, que entra en pánico si corta un carácter).
  etiquetas: ["E0277", "UTF-8"]

- id: m11-match-string
  titulo: "match sobre un String"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: media
  tipo: no-compila
  enunciado: "¿Cómo se arregla?"
  ej: m11/match-string
  opciones:
    - "`match orden.as_str() { \"salir\" => …, _ => … }`: los patrones literales son `&str` y `orden` es un `String` (E0308)"
    - "Añadiendo un brazo para cada texto posible"
    - "Declarando `orden` como `mut`"
    - "No tiene arreglo: no se puede hacer match de texto"
  correcta: 0
  solucion: |
    Un patrón `"salir"` tiene tipo `&'static str`. Con `as_str()` (o `&*orden`) comparas un `&str` con otro.
  etiquetas: ["E0308", "match", "String"]

- id: m11-devolver-str-local
  titulo: "Devolver un &str de algo local"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: media
  tipo: no-compila
  enunciado: "¿Cuál es el arreglo correcto?"
  ej: m11/devolver-str-local
  opciones:
    - "Devolver el `String` (`-> String` y `completo` sin `&`): la función crea el texto, así que debe entregar su propiedad"
    - "Añadir `'static` a la firma"
    - "Usar `&completo.clone()`"
    - "Declarar `completo` fuera de la función con `static`"
  correcta: 0
  solucion: |
    El compilador primero da E0106 (falta la lifetime de la salida), pero el problema de fondo es que `completo` muere al salir. Ninguna anotación lo arregla: hay que devolver un valor propio.
  etiquetas: ["E0106", "String", "&str"]

- id: m11-trim-split
  titulo: "Limpiar y partir"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/cortar-predice
  opciones:
    - "`\"Hola, mundo\" [\"Hola\", \"mundo\"]`"
    - "`\"  Hola, mundo  \" [\"  Hola\", \"mundo  \"]`"
    - "`\"Hola, mundo\" [\"Hola,\", \"mundo\"]`"
    - "`Hola, mundo [Hola, mundo]`"
  correcta: 0
  solucion: |
    `trim()` quita espacios de los extremos (y devuelve una vista, sin copiar). `split(", ")` corta por el separador exacto y lo quita. `{:?}` pone comillas a los `&str`.
  etiquetas: ["str", "split", "trim"]

- id: m11-hashmap-insert
  titulo: "Insertar dos veces la misma clave"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/hashmap-predice
  opciones:
    - "`Some(7) None 2`"
    - "`Some(10) None 2`"
    - "`Some(7) None 3`"
    - "`7 0 2`"
  correcta: 0
  solucion: |
    `insert` con una clave que ya existe **sustituye** el valor (y devuelve el viejo, `Some(10)`, que aquí se descarta). `get` devuelve `Option<&V>`: `None` si no está.
  etiquetas: ["HashMap", "Option"]

- id: m11-hashmap-orden
  titulo: "¿En qué orden salen las claves?"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: media
  tipo: opcion
  enunciado: "Insertas las claves `a`, `b`, `c`, `d`, `e` y `f` en un `HashMap` y recorres `keys()`. ¿En qué orden salen?"
  opciones:
    - "En un orden que no está garantizado: puede cambiar entre ejecuciones, porque el `HashMap` usa una semilla aleatoria"
    - "En orden alfabético"
    - "En el orden de inserción"
    - "En orden inverso de inserción"
  correcta: 0
  solucion: |
    El ejemplo `m11/hashmap-orden` imprimió `["e", "f", "c", "d", "b", "a"]` en una ejecución; otra puede dar otro orden. `HashMap` usa SipHash con una clave aleatoria por proceso para resistir ataques de colisiones. Si necesitas orden, usa `BTreeMap` (ordenado por clave) u ordena las claves.
  etiquetas: ["HashMap", "orden"]

- id: m11-btreemap-ordena
  titulo: "BTreeMap y HashSet"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/btree-predice
  opciones:
    - "`{\"Ana\": 9, \"Luis\": 6, \"Zoe\": 8}` y `3`"
    - "`{\"Zoe\": 8, \"Ana\": 9, \"Luis\": 6}` y `6`"
    - "`{\"Ana\": 9, \"Luis\": 6, \"Zoe\": 8}` y `6`"
    - "`{\"Zoe\": 8, \"Ana\": 9, \"Luis\": 6}` y `3`"
  correcta: 0
  solucion: |
    `BTreeMap` mantiene las claves **ordenadas** (aquí, alfabéticamente). Un `HashSet` guarda cada valor una sola vez: de `[3, 1, 3, 2, 1, 3]` quedan 3 valores distintos.
  etiquetas: ["BTreeMap", "HashSet"]

- id: m11-vecdeque
  titulo: "Una cola por los dos lados"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m11/vecdeque-predice
  opciones:
    - "`Some(\"Zoe\") [\"Ana\", \"Luis\"]`"
    - "`Some(\"Ana\") [\"Luis\", \"Zoe\"]`"
    - "`Some(\"Zoe\") [\"Luis\", \"Ana\"]`"
    - "`Some(\"Luis\") [\"Zoe\", \"Ana\"]`"
  correcta: 0
  solucion: |
    `push_front("Zoe")` la pone delante de todos, y `pop_front` saca la de delante. `VecDeque` es un búfer circular: meter y sacar por los dos extremos es O(1).
  etiquetas: ["VecDeque"]

- id: m11-vecdeque-slice
  titulo: "Un VecDeque no es un slice"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: dificil
  tipo: no-compila
  enunciado: "¿Por qué no se puede obtener un `&[i32]` de un `VecDeque` con `&cola[..]`?"
  ej: m11/vecdeque-indice
  opciones:
    - "Porque sus elementos pueden estar partidos en dos trozos del búfer circular: no siempre son contiguos. Hay que usar `as_slices()` o `make_contiguous()`"
    - "Porque `VecDeque` no se puede indexar de ninguna forma"
    - "Porque `cola` no es `mut`"
    - "Porque los rangos solo valen con `String`"
  correcta: 0
  solucion: |
    Un slice exige elementos seguidos. `as_slices()` devuelve los dos trozos; `make_contiguous()` (necesita `&mut`) los recoloca y devuelve un único slice. `cola[0]` sí funciona.
  etiquetas: ["VecDeque", "slices", "E0308"]

- id: m11-set-sin-hash
  titulo: "Un HashSet de puntos"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: media
  tipo: no-compila
  enunciado: "¿Qué le falta a `Punto` para poder guardarlo en un `HashSet`?"
  ej: m11/set-sin-hash
  opciones:
    - "Implementar `Eq` y `Hash` (`#[derive(PartialEq, Eq, Hash)]`)"
    - "Implementar `Clone`"
    - "Implementar `Display`"
    - "Ser `Copy`"
  correcta: 0
  solucion: |
    Un conjunto de hash necesita **calcular el hash** de cada valor y **comparar** valores iguales con una igualdad total (`Eq`). `PartialEq` solo no basta.
  etiquetas: ["E0277", "HashSet", "Hash"]

- id: m11-get-mut-prestamo
  titulo: "Leer e insertar a la vez"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: media
  tipo: no-compila
  enunciado: "¿Qué fallo de memoria evita este error?"
  ej: m11/hashmap-get-mut-prestamo
  opciones:
    - "`insert` puede hacer crecer la tabla y mudar sus entradas; `p` apuntaría a memoria liberada (E0502)"
    - "Ninguno: es solo una regla de estilo"
    - "Una carrera de datos entre hilos"
    - "Un desbordamiento del contador"
  correcta: 0
  solucion: |
    `p` es un préstamo compartido de un valor **dentro** del mapa y se usa después del `insert`, que necesita un préstamo exclusivo. Arreglo: copia el valor (`let p = *puntos.get("ana").unwrap();`) o usa `p` antes de insertar.
  etiquetas: ["E0502", "HashMap"]

- id: m11-entry
  titulo: "Contar palabras"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: media
  tipo: opcion
  enunciado: "¿Qué línea cuenta cuántas veces aparece cada palabra en un `HashMap<&str, u32>` llamado `cuenta`?"
  codigo: |
    for palabra in texto.split_whitespace() {
        // ???
    }
  opciones:
    - "`*cuenta.entry(palabra).or_insert(0) += 1;`"
    - "`cuenta[palabra] += 1;`"
    - "`cuenta.insert(palabra, cuenta[palabra] + 1);`"
    - "`cuenta.get(palabra) += 1;`"
  correcta: 0
  solucion: |
    `entry` busca la clave una sola vez y `or_insert(0)` la crea si no estaba; devuelve `&mut u32`. Las otras: `HashMap` no implementa `IndexMut` (no se puede asignar con `[]`), `cuenta[palabra]` entra en pánico si la clave no existe y `get` devuelve `Option<&u32>`.
  etiquetas: ["HashMap", "entry"]

- id: m11-vec-layout
  titulo: "¿Cuánto mide un Vec?"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: media
  tipo: opcion
  enunciado: "En un PC de 64 bits, ¿cuánto mide `size_of::<Vec<[u8; 100]>>()`?"
  opciones:
    - "24 bytes: puntero, capacidad y longitud, sin importar el tamaño de los elementos"
    - "100 bytes"
    - "124 bytes"
    - "Depende de cuántos elementos tenga"
  correcta: 0
  solucion: |
    El `Vec` en sí es una ficha de tres `usize`; los elementos están en el heap. En el navegador (wasm32), el ejemplo `m11/vec-por-dentro` muestra 12 bytes.
  etiquetas: ["Vec", "layout"]

- id: m11-with-capacity
  titulo: "Reservar de antemano"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: media
  tipo: opcion
  enunciado: "Vas a meter exactamente 10 000 elementos en un vector. ¿Qué ganas con `Vec::with_capacity(10_000)`?"
  opciones:
    - "Una sola reserva en el heap, en vez de varias reubicaciones (con sus copias) a medida que crece"
    - "Que el vector ya tenga 10 000 elementos (a cero)"
    - "Que no pueda crecer más de 10 000"
    - "Nada: es igual que `Vec::new()`"
  correcta: 0
  solucion: |
    `with_capacity` reserva sitio, pero la longitud sigue siendo 0. Si te pasas, el vector crece igual. Para tener 10 000 ceros, `vec![0; 10_000]`.
  etiquetas: ["Vec", "capacidad"]

- id: m11-get-vs-indice
  titulo: "Índice fuera de rango"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: facil
  tipo: opcion
  enunciado: "Con `let v = vec![1, 2, 3];`, ¿qué diferencia hay entre `v[7]` y `v.get(7)`?"
  opciones:
    - "`v[7]` entra en pánico al ejecutar; `v.get(7)` devuelve `None`"
    - "Las dos devuelven `None`"
    - "Las dos dan un error de compilación"
    - "`v[7]` devuelve 0"
  correcta: 0
  solucion: |
    Rust comprueba los límites siempre. Con `[]` el fallo es un pánico; con `get` lo manejas tú con un `Option`. Nunca se lee memoria fuera del vector.
  etiquetas: ["Vec", "pánico", "Option"]

- id: m11-cortar-utf8
  titulo: "Cortar a mitad de una letra"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: media
  tipo: opcion
  enunciado: "¿Qué pasa con `let s = \"ñu\"; let t = &s[0..1];`?"
  opciones:
    - "Pánico al ejecutar: el byte 1 está en mitad de la «ñ», y un `&str` siempre tiene que ser UTF-8 válido"
    - "`t` vale `\"ñ\"`"
    - "`t` vale `\"n\"`"
    - "No compila"
  correcta: 0
  solucion: |
    Los rangos de un `&str` cuentan bytes y se comprueba que caigan en el límite de un carácter. Para cortar por caracteres, usa `char_indices()`.
  etiquetas: ["UTF-8", "slices", "pánico"]

- id: m11-string-vs-str-param
  titulo: "La firma buena para leer texto"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: facil
  tipo: opcion
  enunciado: "Una función solo necesita leer un texto. ¿Qué parámetro es el más flexible?"
  opciones:
    - "`s: &str`"
    - "`s: String`"
    - "`s: &String`"
    - "`s: &mut String`"
  correcta: 0
  solucion: |
    `&str` acepta literales, trozos y (por deref) `&String`. `String` se llevaría el texto; `&String` no acepta literales; `&mut String` pide más de lo necesario.
  etiquetas: ["&str", "String"]

- id: m11-format
  titulo: "format! no consume"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: facil
  tipo: opcion
  enunciado: "Con `let a = String::from(\"pan\"); let b = String::from(\"queso\");`, ¿qué forma de juntarlas deja `a` y `b` usables después?"
  opciones:
    - "`let c = format!(\"{a} {b}\");`"
    - "`let c = a + \" \" + &b;`"
    - "`let c = a; c.push_str(&b);`"
    - "Ninguna"
  correcta: 0
  solucion: |
    `format!` solo presta sus argumentos y crea un `String` nuevo. El `+` consume `a`; y la tercera mueve `a` a `c` (que además debería ser `mut`).
  etiquetas: ["format!", "String"]

- id: m11-chars-vs-bytes
  titulo: "Recorrer un texto"
  mundo: 11-colecciones-y-texto
  tema: texto
  dificultad: media
  tipo: respuesta
  enunciado: "¿Cuántos elementos produce `\"pingüino\".bytes().count()`? (Solo el número.)"
  respuestas: ["9"]
  solucion: |
    «pingüino» tiene 8 caracteres, pero la «ü» ocupa 2 bytes en UTF-8: 9 bytes. `chars().count()` daría 8. El ejemplo `m11/utf8` lo muestra: `pingüino: 9 bytes, 8 chars`.
  etiquetas: ["UTF-8", "bytes"]

- id: m11-elegir-coleccion
  titulo: "¿Qué colección?"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: media
  tipo: opcion
  enunciado: "Necesitas guardar puntuaciones por nombre y luego mostrarlas **ordenadas por nombre**. ¿Qué colección eliges?"
  opciones:
    - "`BTreeMap<String, u32>`"
    - "`HashMap<String, u32>`"
    - "`Vec<u32>`"
    - "`HashSet<String>`"
  correcta: 0
  solucion: |
    `BTreeMap` mantiene las claves ordenadas y su recorrido sale en orden. Con `HashMap` tendrías que copiar y ordenar las claves cada vez.
  etiquetas: ["BTreeMap", "elegir"]

- id: m11-modificar-mientras
  titulo: "Borrar mientras recorres"
  mundo: 11-colecciones-y-texto
  tema: colecciones
  dificultad: media
  tipo: opcion
  enunciado: "Quieres quitar de un `Vec<i32>` todos los números pares. ¿Cuál es la forma idiomática?"
  opciones:
    - "`v.retain(|x| x % 2 != 0);`"
    - "`for x in &v { if x % 2 == 0 { v.remove(…) } }`"
    - "`v.clear();`"
    - "`for i in 0..v.len() { if v[i] % 2 == 0 { v.remove(i); } }`"
  correcta: 0
  solucion: |
    `retain` recorre y compacta el vector en una sola pasada. La segunda no compila (E0502: modificar mientras se recorre). La cuarta compila, pero se salta elementos (al quitar uno, los siguientes se desplazan) y acaba en pánico por índice fuera de rango.
  etiquetas: ["Vec", "retain", "E0502"]
