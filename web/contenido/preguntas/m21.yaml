# Banco de preguntas del mundo 21 · El compilador por dentro
# Todo código y toda salida citados se han verificado con rustc 1.99.1 (y nightly 1.101.0 donde se indica).

- id: m21-etapa-e0425
  titulo: "¿Quién encuentra a totl?"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Qué etapa del compilador produce este error?"
  ej: m21/nombre-desconocido
  opciones: ["El lexer", "La resolución de nombres", "El borrow checker", "LLVM"]
  correcta: 1
  solucion: |
    `error[E0425]: cannot find value totl in this scope` lo da la **resolución de nombres** (`rustc_resolve`), que une cada nombre con su definición.
    - El lexer acepta `totl`: es un identificador válido; no sabe qué nombres existen.
    - El borrow checker trabaja sobre MIR, que ni siquiera llega a construirse.
    - LLVM no ve nombres de variables locales.
  etiquetas: ["E0425", "pipeline"]

- id: m21-cadena-sin-cerrar
  titulo: "La comilla perdida"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: media
  tipo: no-compila
  enunciado: "La comilla que falta está en la línea 3. ¿Por qué el error E0765 señala la línea 4, columna 23?"
  ej: m21/cadena-sin-cerrar
  opciones:
    - "Porque rustc numera desde 0"
    - "Porque la cadena abierta en la línea 3 se cierra con la primera comilla de la línea 4, y la siguiente comilla abre una cadena nueva que nunca se cierra"
    - "Porque el error lo da el parser, que va una línea por detrás"
    - "Porque el punto y coma cierra la cadena"
  correcta: 1
  solucion: |
    El **lexer** solo ve caracteres: desde `"hola;` todo es cadena hasta la siguiente comilla (en `println!("`). Ahí se cierra, y la comilla de la columna 23 abre otra cadena que llega al final del archivo. El error aparece donde el lexer se perdió.
    - rustc numera líneas y columnas desde 1.
    - El parser no llega a ejecutarse con este error de lexer.
    - `;` dentro de una cadena es un carácter más.
  etiquetas: ["E0765", "lexer"]

- id: m21-orden-pipeline
  titulo: "¿Qué va antes?"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: facil
  tipo: opcion
  enunciado: "¿Cuál de estos órdenes de etapas de rustc es el correcto?"
  opciones:
    - "Lexer → parser → HIR → MIR → LLVM IR"
    - "Parser → lexer → MIR → HIR → LLVM IR"
    - "Lexer → MIR → parser → HIR → LLVM IR"
    - "LLVM IR → MIR → HIR → AST → tokens"
  correcta: 0
  solucion: |
    Texto → tokens (lexer) → AST (parser) → (macros y nombres) → HIR → (tipos, THIR) → MIR → monomorfización → LLVM IR → código máquina. Cada etapa necesita el resultado de la anterior. Las demás opciones cambian el orden o lo invierten.
  etiquetas: ["pipeline"]

- id: m21-for-desaparece
  titulo: "El for que no existe"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: facil
  tipo: opcion
  enunciado: "Tras el lowering a HIR, ¿en qué se convierte `for x in v { … }`?"
  opciones:
    - "En un `while` con un índice"
    - "En `match IntoIterator::into_iter(v)` con un `loop` que hace `match Iterator::next(&mut iter)`"
    - "En una llamada a una función `for_each` de la biblioteca"
    - "Se queda igual hasta el código máquina"
  correcta: 1
  solucion: |
    Lo vimos con `rustc +nightly -Zunpretty=hir`: `match into_iter(v) { mut iter => loop { match next(&mut iter) { None {} => break, Some { 0: x } => { … } } } }`. Por eso sirve cualquier tipo con `IntoIterator`.
    - No hay índices: el `for` usa el trait de iteración.
    - `for_each` es un método de iteradores, no el desazucarado de `for`.
    - El `for` desaparece en el HIR.
  etiquetas: ["HIR", "for"]

- id: m21-interrogacion
  titulo: "¿Qué esconde el ?"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: media
  tipo: opcion
  enunciado: "En el HIR, `let n: i32 = s.parse()?;` aparece como `match branch(s.parse()) { … }`. ¿Qué hace la rama `Break { 0: residual }`?"
  opciones:
    - "`panic!` con el error"
    - "`return from_residual(residual)`: devuelve el error convertido a quien llamó"
    - "`continue` al siguiente valor"
    - "Ignora el error y usa 0"
  correcta: 1
  solucion: |
    Salida real de `-Zunpretty=hir`: `Break { 0: residual } => return from_residual(residual), Continue { 0: val } => val`. `?` propaga con `return`; nunca entra en pánico ni inventa valores.
  etiquetas: ["HIR", "?", "Try"]

- id: m21-predice-expansion
  titulo: "Macros que no pegan texto"
  mundo: 21-el-compilador-por-dentro
  tema: macros
  dificultad: media
  tipo: predice
  enunciado: "¿Qué imprime la primera línea?"
  ej: m21/expansion
  opciones: ["cuadrado!(2 + 1) = 5", "cuadrado!(2 + 1) = 9", "cuadrado!(2 + 1) = 6", "No compila"]
  correcta: 1
  solucion: |
    `$e:expr` es un nodo de expresión ya agrupado; la expansión real es `(2 + 1) * (2 + 1)` = 9. Si la macro pegara texto daría `2 + 1 * 2 + 1` = 5, pero las macros de Rust sustituyen árboles de tokens.
  etiquetas: ["macro_rules", "expansión"]

- id: m21-higiene
  titulo: "Dos x distintas"
  mundo: 21-el-compilador-por-dentro
  tema: macros
  dificultad: media
  tipo: predice
  enunciado: "¿Qué imprimen la segunda y la tercera línea?"
  ej: m21/expansion
  opciones:
    - "doble_de!(x) = 4 y x sigue valiendo 2"
    - "doble_de!(x) = 20 y x sigue valiendo 10"
    - "doble_de!(x) = 20 y x sigue valiendo 2"
    - "No compila: la macro redeclara x"
  correcta: 1
  solucion: |
    Por la **higiene**, la `x` declarada dentro de la macro (vale 2) y tu `x` (vale 10) son variables distintas: cada identificador lleva su contexto de sintaxis. `$e` es tu `x`, así que `2 * 10` = 20, y tu `x` no cambia.
  etiquetas: ["higiene", "macro_rules"]

- id: m21-pratt-asociatividad
  titulo: "8 - 3 - 2"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: media
  tipo: predice
  enunciado: "¿Qué árbol y resultado imprime el parser para `8 - 3 - 2`?"
  ej: m21/pratt
  opciones:
    - "Bin('-', Num(8), Bin('-', Num(3), Num(2))) = 7"
    - "Bin('-', Bin('-', Num(8), Num(3)), Num(2)) = 3"
    - "Bin('-', Num(8), Num(3)) = 5"
    - "Un pánico: dos operadores iguales seguidos"
  correcta: 1
  solucion: |
    El bucle se para con `p <= minimo`: un `-` del mismo nivel no entra en el hijo derecho, así que la resta se asocia por la izquierda: `(8 - 3) - 2` = 3. Es la salida real del ejemplo.
  etiquetas: ["parser", "precedencia"]

- id: m21-thir-into
  titulo: "Un método que ya no es método"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: dificil
  tipo: opcion
  enunciado: "En el THIR de `fn suma(a: u8, b: u8) -> u32 { (a + b).into() }`, ¿qué es `.into()`?"
  opciones:
    - "Una búsqueda dinámica del método"
    - "Un nodo `Call` a `core::convert::Into::into` con argumentos de tipo `[u8, u32]`"
    - "Un cast `as u32`"
    - "Un acceso al campo `into`"
  correcta: 1
  solucion: |
    Salida real de `-Zunpretty=thir-tree`: `Call { ty: FnDef(DefId(2:4071 ~ core[4712]::convert::Into::into), Binder { value: [u8, u32], … }) … }`. La resolución de métodos ya eligió la función concreta, `<u8 as Into<u32>>::into`. No es un cast ni un campo, y Rust resuelve los métodos al compilar.
  etiquetas: ["THIR", "typeck"]

- id: m21-e0308
  titulo: "u8 no es u32"
  mundo: 21-el-compilador-por-dentro
  tema: tipos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila?"
  ej: m21/tipos-no-cuadran
  opciones:
    - "Porque `12` no cabe en un `u8`"
    - "Porque `area` espera `u32` y recibe `u8`, y Rust no convierte enteros implícitamente"
    - "Porque falta `mut`"
    - "Porque `area` está declarada después de usarse"
  correcta: 1
  solucion: |
    E0308 `expected u32, found u8`: la comprobación de tipos unifica el tipo del argumento con el de la firma y falla. El `help:` propone `lado.into()`, una conversión explícita sin pérdida.
    - 12 cabe de sobra en un `u8`.
    - Nada se modifica: `mut` no tiene que ver.
    - En Rust el orden de las funciones en el archivo no importa.
  etiquetas: ["E0308", "typeck"]

- id: m21-mir-local-retorno
  titulo: "El local cero"
  mundo: 21-el-compilador-por-dentro
  tema: mir
  dificultad: facil
  tipo: opcion
  enunciado: "En MIR, ¿qué es `_0`?"
  opciones: ["El primer argumento", "El valor de retorno", "Un temporal cualquiera", "El puntero a la pila"]
  correcta: 1
  solucion: "Por convenio `_0` es el lugar de retorno; `_1`, `_2`… son los argumentos y después vienen variables y temporales. `return` devuelve lo que haya en `_0`."
  etiquetas: ["MIR"]

- id: m21-mir-camino-none
  titulo: "El camino del None"
  mundo: 21-el-compilador-por-dentro
  tema: mir
  dificultad: media
  tipo: opcion
  enunciado: "En el MIR de `doble(x: Option<u32>)`, `bb0` termina en `switchInt(move _2) -> [0: bb2, 1: bb3, otherwise: bb1]`. `bb2` pone `_0 = const 0_u32` y salta a `bb5` (`return`). ¿Qué camino sigue `doble(None)`?"
  opciones: ["bb0 → bb3 → bb4 → bb5", "bb0 → bb2 → bb5", "bb0 → bb1", "bb0 → bb5"]
  correcta: 1
  solucion: "`None` es la variante 0 de `Option`: `switchInt` salta a `bb2`. `bb3` es la rama `Some`, y `bb1` es `unreachable` (el discriminante solo puede ser 0 o 1)."
  etiquetas: ["MIR", "switchInt"]

- id: m21-mir-assert-overflow
  titulo: "El assert escondido"
  mundo: 21-el-compilador-por-dentro
  tema: mir
  dificultad: media
  tipo: predice
  enunciado: "En el perfil **debug**, ¿qué pasa en la tercera llamada, `doble(Some(3_000_000_000))`?"
  ej: m21/mir-doble
  opciones:
    - "Imprime 6000000000"
    - "Entra en pánico con `attempt to multiply with overflow`"
    - "Imprime 1705032704"
    - "No compila"
  correcta: 1
  solucion: |
    El MIR de debug tiene `MulWithOverflow` seguido de un terminador `assert`; el `assert` falla y el programa entra en pánico (salida real: `attempt to multiply with overflow`). En **release** la comprobación no existe y el resultado da la vuelta: 1705032704, que es 6 000 000 000 − 2³². 6000000000 no cabe en un `u32`.
  etiquetas: ["MIR", "overflow"]

- id: m21-mir-sin-drop-1
  titulo: "¿Dónde está el drop de _1?"
  mundo: 21-el-compilador-por-dentro
  tema: mir
  dificultad: media
  tipo: opcion
  enunciado: "En el MIR de `fn saluda(nombre: String) -> usize { let s = nombre; s.len() }` hay `_2 = move _1;` y luego `drop(_2)`, pero ningún `drop(_1)`. ¿Por qué?"
  opciones:
    - "Porque los argumentos nunca se destruyen"
    - "Porque `_1` se movió a `_2`; destruir los dos sería una doble liberación"
    - "Porque `String` no necesita drop"
    - "Porque el optimizador lo quitó"
  correcta: 1
  solucion: "Tras `move`, el origen ya no posee nada: el compilador solo inserta `drop` para el dueño final de cada camino. Un argumento que no se mueve sí se destruye. Y es MIR sin optimizar (`-C opt-level=0`)."
  etiquetas: ["MIR", "drop", "move"]

- id: m21-cleanup
  titulo: "Bloques de limpieza"
  mundo: 21-el-compilador-por-dentro
  tema: mir
  dificultad: media
  tipo: opcion
  enunciado: "¿Cuándo se ejecuta un bloque MIR marcado `(cleanup)`?"
  opciones:
    - "Al final de cada función"
    - "Solo durante el unwinding de un pánico"
    - "Al liberar la pila del hilo"
    - "Nunca: es código muerto"
  correcta: 1
  solucion: "Los bloques `cleanup` son el camino del pánico con `panic = \"unwind\"`: hacen los `drop` pendientes y terminan en `resume` para seguir desenrollando. Con `-C panic=abort` desaparecen y las aristas dicen `unwind unreachable` (verificado)."
  etiquetas: ["MIR", "unwind"]

- id: m21-e0381
  titulo: "Un camino sin valor"
  mundo: 21-el-compilador-por-dentro
  tema: mir
  dificultad: media
  tipo: no-compila
  enunciado: "`llueve` vale `true`. ¿Por qué no compila?"
  ej: m21/sin-inicializar
  opciones:
    - "Porque `x` debería ser `mut`"
    - "Porque en el grafo de MIR existe un camino (`llueve == false`) que llega al uso de `x` sin asignarlo, y el análisis no evalúa condiciones"
    - "Porque `println!` no acepta enteros"
    - "Porque `let x: i32;` sin valor es ilegal"
  correcta: 1
  solucion: |
    E0381 `used binding x is possibly-uninitialized`. El análisis razona sobre caminos, no sobre valores (la nota del error lo dice). Asignar una sola vez a una variable declarada sin valor no requiere `mut`, y `let x: i32;` es legal si **todos** los caminos asignan antes de leer.
  etiquetas: ["E0381", "MIR"]

- id: m21-nll-ultimo-uso
  titulo: "¿Hasta cuándo dura el préstamo?"
  mundo: 21-el-compilador-por-dentro
  tema: prestamos
  dificultad: facil
  tipo: opcion
  enunciado: "Con NLL, ¿hasta dónde vive el préstamo `let primero = &puntos[0];` si `primero` solo se usa en el `println!` siguiente?"
  opciones:
    - "Hasta el final del bloque `{}`"
    - "Hasta su último uso, el `println!`"
    - "Hasta que `puntos` se destruya"
    - "Para siempre (`'static`)"
  correcta: 1
  solucion: "NLL define las regiones como conjuntos de puntos del MIR donde la referencia aún puede usarse. Por eso el ejemplo `m21/nll` puede hacer `puntos.push(40)` después: el préstamo ya terminó."
  etiquetas: ["NLL"]

- id: m21-two-phase
  titulo: "v.push(v.len())"
  mundo: 21-el-compilador-por-dentro
  tema: prestamos
  dificultad: media
  tipo: opcion
  enunciado: "¿Por qué compila `puntos.push(puntos.len());` si `push` necesita `&mut puntos` y `len` necesita `&puntos`?"
  opciones:
    - "Porque `len` no toma prestado nada"
    - "Por los two-phase borrows: el `&mut` de `push` se reserva, se evalúa `len()` y solo después se activa"
    - "Porque el compilador copia el `Vec`"
    - "No compila"
  correcta: 1
  solucion: "El préstamo exclusivo reservado todavía permite leer; se activa al hacer la llamada. Compila: lo verás en la salida de `m21/nll` (`[10, 20, 30, 40, 4]`). `len` sí toma `&self`, y nada se copia."
  etiquetas: ["two-phase", "NLL"]

- id: m21-problema-3
  titulo: "El problema 3"
  mundo: 21-el-compilador-por-dentro
  tema: prestamos
  dificultad: dificil
  tipo: no-compila
  enunciado: "Esta función es segura, pero Rust estable 1.99.1 la rechaza. ¿Por qué?"
  ej: m21/problema-3
  opciones:
    - "Porque devuelve una referencia a una variable local"
    - "Porque NLL extiende el préstamo de `mapa.get` a toda la lifetime del valor devuelto, que incluye el `insert`, sin distinguir que ese camino no devuelve `v`"
    - "Porque `HashMap::insert` no existe para `&mut HashMap`"
    - "Porque falta `mut` en `k`"
  correcta: 1
  solucion: |
    E0502 con la nota `returning this value requires that *mapa is borrowed for '1`. NLL usa un solo conjunto de puntos por región. Polonius, sensible al flujo, acepta el programa: lo comprobamos con la nightly 1.101.0 (2026-11-01), que lo compila sin opciones porque Polonius alpha viene activado. No se devuelve ninguna local; `insert` existe con `&mut self`; `k` no se modifica.
  etiquetas: ["E0502", "Polonius", "NLL"]

