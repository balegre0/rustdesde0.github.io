- id: m21-e0277-display
  titulo: "La regla que falta"
  mundo: 21-el-compilador-por-dentro
  tema: traits
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Qué obligación no puede demostrar el solver?"
