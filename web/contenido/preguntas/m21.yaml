- id: m21-miri-motor
  titulo: "El mismo motor"
  mundo: 21-el-compilador-por-dentro
  tema: const
  dificultad: media
  tipo: opcion
  enunciado: "¿Qué tienen en común la evaluación de `const` y Miri?"
  opciones:
    - "Nada"
    - "Usan el mismo intérprete de MIR; Miri le añade la detección de comportamiento indefinido"
    - "Los dos usan LLVM"
    - "Los dos se ejecutan en el navegador"
  correcta: 1
  solucion: "`rustc_const_eval` está escrito sobre una «máquina» con ganchos: la de constantes es estricta, la de Miri comprueba aliasing, memoria sin inicializar, punteros colgantes…"
  etiquetas: ["Miri", "const eval"]

- id: m21-mono-copias
  titulo: "¿Cuántas copias?"
  mundo: 21-el-compilador-por-dentro
  tema: genericos
  dificultad: facil
  tipo: predice
  enunciado: "El programa llama a `describe` con `u8`, `&str` y `Vec<f64>`. ¿Qué imprime la tercera línea?"
  ej: m21/monomorfizacion
  opciones:
    - "[1.5, 2.5] es un T"
    - "[1.5, 2.5] es un alloc::vec::Vec<f64>"
    - "[1.5, 2.5] es un Vec"
    - "No compila"
  correcta: 1
  solucion: "Cada copia monomorfizada conoce su `T`: `type_name::<T>()` da la ruta completa, `alloc::vec::Vec<f64>` (salida real). Hay una copia por tipo."
  etiquetas: ["monomorfización"]

- id: m21-mono-asm
  titulo: "maxsd y cmova"
  mundo: 21-el-compilador-por-dentro
  tema: genericos
  dificultad: dificil
  tipo: opcion
  enunciado: "El asm real de `mayor::<f64>` es `maxsd xmm0, xmm1` y el de `mayor::<u8>` usa `cmp` y `cmova`. ¿Qué demuestra?"
  opciones:
    - "Que una copia está optimizada y la otra no"
    - "Que cada copia monomorfizada se compila con su tipo concreto y recibe instrucciones específicas"
    - "Que `PartialOrd` está escrito en ensamblador"
    - "Un error del compilador"
  correcta: 1
  solucion: "Es la esencia de la monomorfización: código especializado por tipo. En los símbolos v0 se ve el tipo: `…5mayordE…` (`d` = `f64`) y `…5mayorhE…` (`h` = `u8`)."
  etiquetas: ["monomorfización", "asm"]

- id: m21-noalias
  titulo: "La promesa de &mut"
  mundo: 21-el-compilador-por-dentro
  tema: codegen
  dificultad: media
  tipo: predice
  enunciado: "¿Qué imprime `con_crudos(p, p)`?"
  ej: m21/noalias
  opciones: ["1", "2", "0", "Comportamiento indefinido"]
  correcta: 1
  solucion: |
    Con punteros crudos al mismo `i32`, escribir 2 por `b` cambia `*a`, y la función tiene que volver a leer: 2. La versión con `&mut` puede devolver 1 sin leer porque rustc marca los parámetros `noalias` en el LLVM IR (verificado: `ret i32 1`). Pasar dos punteros crudos iguales es legal.
  etiquetas: ["noalias", "LLVM"]

- id: m21-e0499-mismo
  titulo: "Dos veces x"
  mundo: 21-el-compilador-por-dentro
  tema: prestamos
  dificultad: facil
  tipo: no-compila
  enunciado: "¿Por qué no compila `con_refs(&mut x, &mut x)`?"
  ej: m21/mismo-dos-veces
  opciones:
    - "Porque `x` no es `mut`"
    - "Porque hay dos préstamos exclusivos del mismo valor vivos a la vez (E0499)"
    - "Porque `con_refs` devuelve `i32`"
    - "Porque falta `unsafe`"
  correcta: 1
  solucion: "E0499 `cannot borrow x as mutable more than once at a time`. Si se permitiera, la promesa `noalias` sería falsa y la versión optimizada devolvería 1 aunque `x` acabe valiendo 2. `x` sí es `mut`, y `unsafe` no autoriza a crear dos `&mut` al mismo sitio."
  etiquetas: ["E0499", "noalias"]

- id: m21-layout-option-ref
  titulo: "El None invisible"
  mundo: 21-el-compilador-por-dentro
  tema: layout
  dificultad: facil
  tipo: opcion
  enunciado: "En x86-64, ¿cuánto ocupa `Option<&u8>`?"
  opciones: ["8", "9", "16", "1"]
  correcta: 0
  solucion: "Una referencia nunca es nula: el 0 es un nicho que guarda el `None`. Verificado con `const _: () = assert!(size_of::<Option<&u8>>() == 8)`. En el navegador (wasm32) mide 4."
  etiquetas: ["nichos", "layout"]

- id: m21-layout-raw
  titulo: "Punteros sin nicho"
  mundo: 21-el-compilador-por-dentro
  tema: layout
  dificultad: media
  tipo: opcion
  enunciado: "En x86-64, ¿cuánto ocupa `Option<*const u8>`?"
  opciones: ["8", "9", "16", "24"]
  correcta: 2
  solucion: "Un puntero crudo puede ser nulo: no hay valor imposible, así que hace falta etiqueta, y con el alineamiento de 8 el total es 16 (verificado)."
  etiquetas: ["nichos", "layout"]

- id: m21-layout-tres-casos
  titulo: "Un solo nicho"
  mundo: 21-el-compilador-por-dentro
  tema: layout
  dificultad: dificil
  tipo: opcion
  enunciado: "En x86-64, `enum { A(Box<u64>), B }` ocupa 8 bytes. ¿Cuánto ocupa `enum { A(Box<u64>), B, C }`?"
  opciones: ["8", "9", "16", "24"]
  correcta: 2
  solucion: "Un puntero aporta un solo nicho (el 0) aunque esté alineado: rustc no usa los bits bajos. Con dos variantes sin datos hace falta una etiqueta aparte: 16 bytes (verificado en x86-64; 8 en wasm32)."
  etiquetas: ["nichos", "layout"]

- id: m21-layout-reorden
  titulo: "8 frente a 12"
  mundo: 21-el-compilador-por-dentro
  tema: layout
  dificultad: media
  tipo: opcion
  enunciado: "`struct S { a: u8, b: u32, c: u16 }` ocupa 8 bytes; con `#[repr(C)]` ocupa 12. ¿Por qué?"
  opciones:
    - "Porque `repr(C)` añade una cabecera"
    - "Porque `repr(Rust)` reordena los campos (b, c, a) para ahorrar relleno; `repr(C)` respeta el orden de declaración"
    - "Porque `repr(C)` usa enteros de 64 bits"
    - "Es aleatorio"
  correcta: 1
  solucion: "`-Zprint-type-sizes` (nightly) muestra el orden real: `.b` 4, `.c` 2, `.a` 1 y 1 byte de relleno final. Con `repr(C)` hay relleno tras `a` y al final. El orden de `repr(Rust)` no está garantizado."
  etiquetas: ["repr(C)", "layout"]

- id: m21-vtable-llamada
  titulo: "Una instrucción"
  mundo: 21-el-compilador-por-dentro
  tema: dyn
  dificultad: dificil
  tipo: opcion
  enunciado: "El asm real de `fn llama_area(f: &dyn Forma) -> f64 { f.area() }` en x86-64 Windows es `rex64 jmp qword ptr [rdx + 24]`. ¿Por qué `+ 24`?"
  opciones:
    - "Porque `area` es el método número 24"
    - "Porque la vtable empieza con 3 palabras de 8 bytes (drop, tamaño, alineamiento) y `area` es el primer método"
    - "Porque el `f64` mide 24 bytes"
    - "Porque `rdx` apunta a los datos"
  correcta: 1
  solucion: "El puntero gordo llega en `rcx` (datos) y `rdx` (vtable). 3 × 8 = 24 es el desplazamiento del primer método. Es `jmp` porque es una llamada de cola."
  etiquetas: ["vtable", "dyn", "asm"]

- id: m21-vtable-drop-cero
  titulo: "Una casilla a cero"
  mundo: 21-el-compilador-por-dentro
  tema: dyn
  dificultad: media
  tipo: opcion
  enunciado: "En la vtable real de `Circulo(f64)` para `Forma`, la primera palabra vale 0. ¿Qué significa?"
  opciones:
    - "Que `Circulo` mide 0 bytes"
    - "Que no hay función `drop_in_place` porque `Circulo` no necesita nada al destruirse"
    - "Que la vtable está vacía"
    - "Que el primer método no existe"
  correcta: 1
  solucion: "Las siguientes palabras son 8 (tamaño) y 8 (alineamiento), y después van los punteros a `area` y `nombre`. Si `Circulo` tuviera un `String`, ahí habría un puntero a la función que lo destruye."
  etiquetas: ["vtable"]

- id: m21-async-tamano
  titulo: "El array viajero"
  mundo: 21-el-compilador-por-dentro
  tema: async
  dificultad: media
  tipo: predice
  enunciado: "¿Cuántos bytes ocupa `con_array()`?"
  ej: m21/future-a-mano
  opciones: ["8", "24", "102", "4096"]
  correcta: 2
  solucion: "El array de 100 bytes vive a través del `.await`, así que va dentro del futuro: 100 + 1 (futuro de `paso`) + 1 (etiqueta) = 102. `-Zprint-type-sizes` muestra los estados `Unresumed`, `Suspend0` (con `.a` y `.__awaitee`), `Returned` y `Panicked`."
  etiquetas: ["async", "corrutina"]

- id: m21-async-no-ejecuta
  titulo: "Llamar no es ejecutar"
  mundo: 21-el-compilador-por-dentro
  tema: async
  dificultad: facil
  tipo: opcion
  enunciado: "¿Qué hace `guardar();` (un `async fn`) dentro de otra función async, sin `.await`?"
  opciones:
    - "Lo ejecuta en segundo plano"
    - "Solo construye el futuro en estado `Unresumed`; si nadie lo sondea, el cuerpo nunca se ejecuta"
    - "Lo ejecuta en otro hilo"
    - "Da error de compilación siempre"
  correcta: 1
  solucion: "Un `async fn` devuelve un enum sin ejecutar nada. El compilador avisa con `unused_must_use` porque los futuros son `#[must_use]`, pero es un aviso, no un error."
  etiquetas: ["async"]

- id: m21-panic-wasm
  titulo: "Pánico en el navegador"
  mundo: 21-el-compilador-por-dentro
  tema: panicos
  dificultad: media
  tipo: predice
  enunciado: "En el navegador, ¿se imprime `drop de a`?"
  ej: m21/panico-en-wasm
  opciones:
    - "Sí, y luego `catch_unwind devolvió Err: true`"
    - "No: el target del navegador usa `panic=\"abort\"` y el programa termina en el pánico"
    - "Sí, pero no se imprime la línea de `catch_unwind`"
    - "No compila"
  correcta: 1
  solucion: "`rustc --print cfg --target wasm32-wasip1` da `panic=\"abort\"` (y el host x86-64 Windows `panic=\"unwind\"`). Salida real en el navegador: `drop de x`, el mensaje del pánico, y nada más."
  etiquetas: ["panic", "abort", "wasm"]

- id: m21-panic-abort-mir
  titulo: "unwind unreachable"
  mundo: 21-el-compilador-por-dentro
  tema: panicos
  dificultad: dificil
  tipo: opcion
  enunciado: "Al compilar con `-C panic=abort`, el MIR de `saluda` cambia `unwind: bb3` por `unwind unreachable` y los bloques `cleanup` desaparecen. ¿Qué consecuencia tiene?"
  opciones:
    - "La función ya no puede entrar en pánico"
    - "Si hay un pánico, el proceso termina sin ejecutar ningún `drop` pendiente"
    - "Los pánicos se ignoran"
    - "El programa es más lento"
  correcta: 1
  solucion: "La llamada puede seguir entrando en pánico; lo que no existe es el camino de vuelta. A cambio, el binario es más pequeño y no lleva tablas de desenrollado."
  etiquetas: ["panic", "MIR"]

- id: m21-queries-verde
  titulo: "Verde y rojo"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: media
  tipo: predice
  enunciado: "¿Qué imprime la última línea?"
  ej: m21/mini-queries
  opciones:
    - "total = 5  (ejecuciones: 4)"
    - "total = 5  (ejecuciones: 3)"
    - "total = 4  (ejecuciones: 2)"
    - "total = 5  (ejecuciones: 6)"
  correcta: 1
  solucion: "Primera vez: 2 ejecuciones. Segunda: 0 (todo verde). Tras editar `lib.rs` (ahora con 2 líneas): solo se recalcula esa: 3 ejecuciones y total 3 + 2 = 5."
  etiquetas: ["queries", "incremental"]

- id: m21-cargo-check
  titulo: "¿Por qué check vuela?"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: facil
  tipo: opcion
  enunciado: "¿Por qué `cargo check` es mucho más rápido que `cargo build`?"
  opciones:
    - "Porque no comprueba los préstamos"
    - "Porque para tras el análisis y solo genera metadatos: sin monomorfización, sin LLVM, sin enlazado"
    - "Porque usa otra versión de rustc"
    - "Porque compila en paralelo y build no"
  correcta: 1
  solucion: "`check` ejecuta tipos y borrow checker (te da todos esos errores) y se ahorra lo más caro. Es lo mismo que `rustc --emit=metadata`."
  etiquetas: ["cargo", "tiempos"]

- id: m21-cranelift
  titulo: "Otro backend"
  mundo: 21-el-compilador-por-dentro
  tema: codegen
  dificultad: media
  tipo: opcion
  enunciado: "¿Qué es Cranelift en el contexto de rustc?"
  opciones:
    - "Un borrow checker alternativo"
    - "Un backend de generación de código que compila más rápido que LLVM optimizando menos, pensado para debug"
    - "Un nuevo frontend de Rust escrito en C++"
    - "El enlazador de Windows"
  correcta: 1
  solucion: "En nightly se instala con el componente `rustc-codegen-cranelift` (comprobado en el manifiesto de noviembre de 2026). El frontend nuevo dentro de GCC es gccrs, otra cosa."
