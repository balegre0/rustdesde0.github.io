- id: m21-const-desborda
  titulo: "21! no cabe"
  mundo: 21-el-compilador-por-dentro
  tema: const
  dificultad: media
  tipo: no-compila
  enunciado: "Compilado en debug, ¿por qué falla?"
  ej: m21/const-desborda
  opciones:
    - "Porque `const fn` no admite bucles"
    - "Porque el intérprete de MIR evalúa `factorial(21)` al compilar y la multiplicación desborda"
    - "Porque `u64` no existe en constantes"
    - "Porque `main` no puede leer constantes"
  correcta: 1
  solucion: |
    E0080: `attempt to compute 2432902008176640000_u64 * 21_u64, which would overflow`, con `note: inside factorial`. El mensaje conoce los valores porque el intérprete está ejecutando el cálculo. `const fn` admite `while` desde hace años.
    Matiz verificado: en **release** (`overflow-checks=off`) este mismo archivo compila y la constante da la vuelta (`14197454024290336768`), porque el MIR de `factorial` ya no lleva el `assert`.
  etiquetas: ["E0080", "const eval"]

