- id: m21-codegen-pila
  titulo: "Postorden"
  mundo: 21-el-compilador-por-dentro
  tema: compilador
  dificultad: media
  tipo: predice
  enunciado: "¿Qué código genera el mini-compilador para `x * (2 + 3) - 4 * 1`?"
  ej: m21/mini-compilador
  opciones:
    - "código: [CargaX, Empuja(5), Opera('*'), Empuja(4), Opera('-')]"
    - "código: [CargaX, Empuja(2), Empuja(3), Opera('+'), Opera('*'), Empuja(4), Empuja(1), Opera('*'), Opera('-')]"
    - "código: [Opera('-'), Opera('*'), CargaX, Empuja(5), Empuja(4)]"
    - "código: [Empuja(46)]"
  correcta: 0
  solucion: "El plegado de constantes deja `x * 5 - 4` antes de generar código, y el codegen recorre en postorden (hijos y luego operación). La segunda opción sería sin plegar; la última confunde el resultado para `x = 10` con el código."
  etiquetas: ["codegen", "optimización"]

- id: m21-test-ui
  titulo: "Tu primer PR"
  mundo: 21-el-compilador-por-dentro
  tema: comunidad
  dificultad: facil
  tipo: opcion
  enunciado: "¿Qué tipo de primera contribución a rustc se suele recomendar?"
  opciones:
    - "Reescribir el borrow checker"
    - "Mejorar un diagnóstico (issues `E-easy`, `E-mentor`, `A-diagnostics`) con su test UI"
    - "Cambiar la sintaxis del lenguaje"
    - "Sustituir LLVM"
  correcta: 1
  solucion: "Un diagnóstico mejor es un cambio acotado y fácil de revisar, y el test UI (un `.rs` con su `.stderr` esperado) lo protege. Cambiar la sintaxis requiere un RFC; las otras dos son proyectos de años."
  etiquetas: ["contribuir", "rustc"]
