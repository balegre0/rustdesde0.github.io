- id: m23-start
  titulo: "El punto de entrada"
  mundo: 23-embebido-y-tu-so
  tema: kernel
  dificultad: media
  tipo: opcion
  enunciado: "¿Por qué `_start` lleva `#[unsafe(no_mangle)]` y `extern \"C\"`?"
  opciones:
    - "Porque el cargador de arranque busca el símbolo `_start` por su nombre y lo llama con la convención de C"
    - "Por rendimiento"
    - "Porque `main` está prohibido en Rust"
    - "Para que se ejecute en paralelo"
  correcta: 0
  solucion: |
    Sin `no_mangle`, el símbolo tendría un nombre codificado y el cargador no lo encontraría. Y devuelve `!` porque no tiene a quién volver.
  etiquetas: ["no_main", "_start"]

- id: m23-vga-celda
  titulo: "La pantalla de texto"
  mundo: 23-embebido-y-tu-so
  tema: kernel
  dificultad: facil
  tipo: respuesta
  enunciado: "La pantalla de texto VGA tiene 25 × 80 celdas de 2 bytes. ¿Cuántos bytes ocupa en total? (Solo el número.)"
  respuestas: ["4000", "4 000"]
  solucion: |
    25 × 80 = 2 000 celdas × 2 bytes = 4 000 bytes, a partir de la dirección `0xb8000`.
  etiquetas: ["VGA"]

- id: m23-vga-enye
  titulo: "La ñ en VGA"
  mundo: 23-embebido-y-tu-so
  tema: kernel
  dificultad: media
  tipo: opcion
  enunciado: "En el ejemplo `m23/vga`, la última línea empieza por `■■` donde debía haber una «ñ». ¿Por qué dos cuadraditos?"
  opciones:
    - "Porque en UTF-8 la «ñ» ocupa dos bytes, el escritor va byte a byte y ninguno de los dos es ASCII imprimible"
    - "Porque la pantalla no tiene esa letra y la dibuja dos veces"
    - "Porque es un error de la simulación"
    - "Porque `ñ` es un carácter de control"
  correcta: 0
  solucion: |
    El búfer VGA espera un byte por carácter (página de códigos 437). El escritor de blog_os sustituye por `■` lo que no es ASCII imprimible.
  etiquetas: ["UTF-8", "VGA"]

- id: m23-doble-fallo
  titulo: "El triple fallo"
  mundo: 23-embebido-y-tu-so
  tema: kernel
  dificultad: media
  tipo: opcion
  enunciado: "En x86_64, ¿qué pasa si ocurre una excepción al atender un fallo doble y no hay forma de manejarla?"
  opciones: ["Un triple fallo: la máquina se reinicia", "La CPU la ignora", "Se ejecuta el `panic_handler`", "Se apaga la pantalla"]
  correcta: 0
  solucion: |
    Por eso blog_os da al fallo doble una pila propia (con la TSS): así se puede atender aunque la pila normal se haya desbordado.
  etiquetas: ["IDT", "excepciones"]

- id: m23-paginacion-indices
  titulo: "Partir una dirección"
  mundo: 23-embebido-y-tu-so
  tema: memoria
  dificultad: dificil
  tipo: predice
  enunciado: "Para la dirección `0x0000_0000_0000_1234`, ¿qué índices y desplazamiento calcula el ejemplo?"
  ej: m23/paginacion
  opciones:
    - "`P4=0 P3=0 P2=0 P1=1 desplazamiento=0x234`"
    - "`P4=1 P3=2 P2=3 P1=4 desplazamiento=0x000`"
    - "`P4=0 P3=0 P2=0 P1=0 desplazamiento=0x1234`"
    - "`P4=0 P3=0 P2=1 P1=0 desplazamiento=0x234`"
  correcta: 0
  solucion: |
    Los 12 bits bajos (`0x234`) son el desplazamiento; el siguiente bloque de 9 bits vale 1 (el `1` de `0x1234`), y los demás, 0.
  etiquetas: ["paginación"]

- id: m23-tlb
  titulo: "La TLB"
  mundo: 23-embebido-y-tu-so
  tema: memoria
  dificultad: dificil
  tipo: opcion
  enunciado: "El núcleo cambia una entrada de la tabla de páginas. ¿Qué más tiene que hacer?"
  opciones:
    - "Invalidar esa traducción en la TLB (`invlpg`), o la CPU seguiría usando la vieja"
    - "Reiniciar la CPU"
    - "Nada"
    - "Copiar la tabla"
  correcta: 0
  solucion: |
    La TLB es una caché de traducciones recientes, que evita recorrer las cuatro tablas en cada acceso.
  etiquetas: ["TLB", "paginación"]

- id: m23-bump
  titulo: "El asignador bump"
  mundo: 23-embebido-y-tu-so
  tema: memoria
  dificultad: media
  tipo: predice
  enunciado: "En el ejemplo, ¿en qué desplazamiento empieza la reserva de 8 bytes alineados a 8, justo después de una de 3 bytes?"
  ej: m23/asignador
  opciones: ["`8`", "`3`", "`4`", "`0`"]
  correcta: 0
  solucion: |
    Los 3 primeros bytes ocupan 0–2; el siguiente múltiplo de 8 es el 8. Entre 3 y 7 queda un hueco por la alineación.
  etiquetas: ["asignador", "alineación"]

- id: m23-rust-linux
  titulo: "Rust en Linux"
  mundo: 23-embebido-y-tu-so
  tema: ecosistema
  dificultad: facil
  tipo: opcion
  enunciado: "¿En qué versión del núcleo de Linux entró Rust en la rama principal?"
  opciones: ["6.1 (diciembre de 2022)", "5.0", "7.0", "Todavía no ha entrado"]
  correcta: 0
  solucion: |
    Entró como experimento en 6.1; en 2025 los mantenedores decidieron que deja de serlo. Android 16 ya incluye código del núcleo en Rust (ashmem).
  etiquetas: ["Rust for Linux"]
