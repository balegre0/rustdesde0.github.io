# Banco de preguntas del mundo 23 — Embebido y tu sistema operativo (CONTENIDO.md §7.1).
# Código citado: ejemplos/m23/*.rs (simulaciones ejecutables en wasm32-wasip1), rustc 1.99.1.

- id: m23-capas-std
  titulo: "core, alloc, std"
  mundo: 23-embebido-y-tu-so
  tema: no_std
  dificultad: facil
  tipo: opcion
  enunciado: "¿Cuál de estos se puede usar en un crate `#![no_std]` sin `alloc`?"
  opciones: ["`Option<&str>`", "`Vec<u8>`", "`String`", "`println!`"]
  correcta: 0
  solucion: |
    `Option` y `&str` están en `core`. `Vec` y `String` necesitan un asignador (`alloc`); `println!` necesita un sistema operativo (`std`).
  etiquetas: ["no_std", "core"]

- id: m23-sin-heap
  titulo: "Formatear sin heap"
  mundo: 23-embebido-y-tu-so
  tema: no_std
  dificultad: media
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m23/libre-prueba
  opciones: ["`164`, `«4096»` y `«0»`", "`164`, `«4096»` y `«»`", "`4`, `«4096»` y `«0»`", "No compila: hace falta `String`"]
  correcta: 0
  solucion: |
    La suma de los bytes de «hola» (104 + 111 + 108 + 97 = 420) da la vuelta en un `u8`: 420 − 256 = 164. `a_texto` escribe las cifras al final de un búfer prestado y devuelve el trozo usado; con 0 el `loop` escribe al menos una cifra.
  etiquetas: ["no_std", "wrapping_add"]

- id: m23-volatile
  titulo: "Por qué volatile"
  mundo: 23-embebido-y-tu-so
  tema: registros
  dificultad: media
  tipo: opcion
  enunciado: "Escribes 1 y luego 0 en el registro de un pin para generar un pulso. Sin `write_volatile`, ¿qué puede hacer el optimizador?"
  opciones:
    - "Quitar la primera escritura (la segunda la sobrescribe) y el pulso no existiría"
    - "Nada: siempre respeta las escrituras"
    - "Cambiar el orden de los bits"
    - "Añadir más escrituras"
  correcta: 0
  solucion: |
    Para memoria normal, una escritura sobrescrita enseguida no tiene efecto visible. En un registro sí: era el pulso.
  etiquetas: ["volatile", "MMIO"]

- id: m23-volatile-no-sync
  titulo: "volatile no sincroniza"
  mundo: 23-embebido-y-tu-so
  tema: registros
  dificultad: dificil
  tipo: opcion
  enunciado: "¿Sirve `volatile` para compartir una variable entre el programa principal y una interrupción?"
  opciones:
    - "No: no da atomicidad ni orden. Para eso, atómicos o secciones críticas"
    - "Sí, es su uso principal"
    - "Solo en ARM"
    - "Solo con `static mut`"
  correcta: 0
  solucion: |
    `volatile` solo garantiza que el acceso ocurre. No impide que una interrupción lo corte a medias ni ordena otros accesos.
  etiquetas: ["volatile", "atómicos"]

- id: m23-registros-bits
  titulo: "Encender el pin 13"
  mundo: 23-embebido-y-tu-so
  tema: registros
  dificultad: facil
  tipo: opcion
  enunciado: "¿Qué hace `out | (1 << 13)` sobre el valor de un registro de salida?"
  opciones:
    - "Pone a 1 el bit 13 y deja los demás como estaban"
    - "Pone el registro entero a 13"
    - "Pone a 0 el bit 13"
    - "Pone a 1 los 13 primeros bits"
  correcta: 0
  solucion: |
    Leer–modificar–escribir con una máscara cambia un solo pin sin tocar los otros 31. El ejemplo `m23/registros` lo hace con `read_volatile` y `write_volatile`.
  etiquetas: ["bits", "MMIO"]

- id: m23-embedded-hal
  titulo: "Un driver para todos los chips"
  mundo: 23-embebido-y-tu-so
  tema: hal
  dificultad: facil
  tipo: opcion
  enunciado: "Escribes un controlador para un sensor I2C. ¿Contra qué lo escribes para que funcione en cualquier microcontrolador?"
  opciones: ["Los traits de `embedded-hal`", "El PAC de tu chip", "Las direcciones de los registros", "El BSP de tu placa"]
  correcta: 0
  solucion: |
    `embedded-hal` 1.0 define `I2c`, `SpiBus`, `OutputPin`, `DelayNs`… y cada HAL los implementa para su chip.
  etiquetas: ["embedded-hal"]

- id: m23-led-generico
  titulo: "Un LED genérico"
  mundo: 23-embebido-y-tu-so
  tema: hal
  dificultad: facil
  tipo: predice
  enunciado: "¿Qué imprime?"
  ej: m23/hal
  opciones: ["`P0.13: 6 cambios, ahora bajo`", "`P0.13: 3 cambios, ahora alto`", "`P0.13: 6 cambios, ahora alto`", "No compila: `Led` no sabe qué placa es"]
  correcta: 0
  solucion: |
    Cada parpadeo son dos cambios (alto y bajo); tres parpadeos, seis cambios, y el último deja el pin bajo.
  etiquetas: ["genéricos", "traits"]

- id: m23-singleton
  titulo: "Un periférico, un dueño"
  mundo: 23-embebido-y-tu-so
  tema: hal
  dificultad: media
  tipo: opcion
  enunciado: "¿Por qué `Peripherals::take()` devuelve `Some` solo la primera vez?"
  opciones:
    - "Para que exista un único valor dueño de los periféricos: el ownership impide que dos partes del programa configuren el mismo hardware"
    - "Porque los periféricos se agotan"
    - "Por rendimiento"
    - "Porque es un error de diseño"
  correcta: 0
  solucion: |
    Es el patrón singleton con ownership: después de `take`, los periféricos se mueven a quien los use.
  etiquetas: ["ownership", "PAC"]

- id: m23-typestate-pin
  titulo: "Un pin de entrada"
  mundo: 23-embebido-y-tu-so
  tema: hal
  dificultad: media
  tipo: opcion
  enunciado: "En un HAL con typestate, ¿qué pasa si llamas a `set_high()` en un `Pin<Input>`?"
  opciones: ["No compila: ese tipo no tiene el método", "Pánico al ejecutar", "El pin se convierte en salida", "No hace nada"]
  correcta: 0
  solucion: |
    El modo del pin forma parte del tipo; convertirlo (`into_push_pull_output`) consume el pin y devuelve otro tipo. Cuesta 0 bytes.
  etiquetas: ["typestate"]

- id: m23-interrupcion-swap
  titulo: "Leer y borrar a la vez"
  mundo: 23-embebido-y-tu-so
  tema: interrupciones
  dificultad: media
  tipo: opcion
  enunciado: "¿Por qué el ejemplo usa `BOTON_PULSADO.swap(false, Acquire)` en vez de un `load` seguido de un `store(false)`?"
  opciones:
    - "Porque si una interrupción llegara entre el `load` y el `store`, esa pulsación se borraría sin atenderla"
    - "Porque `load` no existe en los atómicos"
    - "Por estilo"
    - "Porque es más lento"
  correcta: 0
  solucion: |
    `swap` es una única operación atómica. El ejemplo `m23/interrupcion` imprime `pulsaciones: 4 · atendidas: 4`.
  etiquetas: ["atómicos", "interrupciones"]

- id: m23-rtic
  titulo: "RTIC"
  mundo: 23-embebido-y-tu-so
  tema: interrupciones
  dificultad: media
  tipo: opcion
  enunciado: "¿Qué usa RTIC como planificador de tareas?"
  opciones:
    - "El controlador de interrupciones del hardware (el NVIC en Cortex-M), con prioridades calculadas al compilar"
    - "Un sistema operativo de tiempo real"
    - "Hilos de `std`"
    - "Un ejecutor async"
  correcta: 0
  solucion: |
    Cada tarea declara los recursos que usa, y RTIC deduce qué protección hace falta (techo de prioridad), sin planificador en software.
  etiquetas: ["RTIC"]

- id: m23-ejecutor
  titulo: "Un ejecutor mínimo"
  mundo: 23-embebido-y-tu-so
  tema: async
  dificultad: media
  tipo: predice
  enunciado: "¿Cuántos sondeos hace el ejecutor del ejemplo? (Primer futuro: 2 ticks; segundo: 3 ticks.)"
  ej: m23/ejecutor
  opciones: ["`… en 6 sondeos`", "`… en 5 sondeos`", "`… en 2 sondeos`", "`… en 7 sondeos`"]
  correcta: 0
  solucion: |
    El primer futuro da `Pending` dos veces; en el tercer sondeo termina y el `async` pasa al segundo en ese mismo sondeo, que da `Pending` tres veces más; el sexto termina todo: 3 + 3 = 6.
  etiquetas: ["async", "ejecutor", "Poll"]

- id: m23-embassy-dormir
  titulo: "Cuando no hay nada que hacer"
  mundo: 23-embebido-y-tu-so
  tema: async
  dificultad: facil
  tipo: opcion
  enunciado: "¿Qué hace Embassy cuando ninguna tarea puede avanzar?"
  opciones: ["Duerme la CPU hasta la siguiente interrupción", "Sondea sin parar", "Crea un hilo", "Termina el programa"]
  correcta: 0
  solucion: |
    Ahorra energía; la interrupción que llegue despierta a la tarea que la esperaba (a través de su `Waker`).
  etiquetas: ["Embassy"]

